<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả Đánh giá Nguy cơ Cháy Nổ - FRAS AI | Công an TP Bắc Ninh</title>
    <link rel="stylesheet" href="/css/main.css?v=20261021_m5">
    <link rel="stylesheet" href="/css/dashboard.css?v=20261014_gov2">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="/css/docket.css?v=20261021_m4">
</head>

<body>
    <!-- HEADER BAR -->
    <nav class="navbar" style="border-bottom: 2px solid #b91c1c;">
        <div class="container">
            <a href="/" class="nav-brand">
                <span class="logo-icon"><img src="/img/logo-cand.png" alt="CAND" width="38" height="38" style="object-fit:contain;"></span>
                <div><span>FRAS</span><small>Công an thành phố Bắc Ninh • PCCC & CNCH</small></div>
            </a>
            <ul class="nav-links" id="nav-links"></ul>
            <div class="nav-user" id="nav-user"></div>
            <button class="nav-mobile-toggle">&#9776;</button>
        </div>
    </nav>

    <div class="page-content" style="padding-top: 85px;">
        <div class="container" id="result-container" style="max-width: 1180px;">
            <div style="text-align:center; padding:80px 20px; background:#ffffff; color:#0f172a; border:2px solid #0f172a;">
                <div class="loading-spinner"></div>
                <h3 style="margin-top:16px; font-weight:800; text-transform:uppercase;">Đang truy xuất hồ sơ thẩm định...</h3>
                <p style="color:#64748b; font-size:0.9rem;">Vui lòng đợi giây lát trong khi hệ thống nạp dữ liệu kết quả</p>
            </div>
        </div>
    </div>

    <script src="/js/api.js?v=20261021_t1"></script>
    <script src="/js/charts.js"></script>
    <script src="/js/export.js?v=20261019c"></script>
    <script>
        let currentAssessmentData = null;
        let isAiAnalyzing = false;

        onReady(async () => {
            setupNavbar();
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (!id) {
                window.location.href = '/history.html';
                return;
            }

            try {
                const data = await api.get(`/assessments/${id}`);
                currentAssessmentData = data;
                renderResult(data);
            } catch (error) {
                document.getElementById('result-container').innerHTML = `
                    <div style="background:#fef2f2; border:2px solid #dc2626; color:#991b1b; padding:24px; text-align:center;">
                        <h3 style="margin:0 0 8px; font-weight:800;">⚠️ KHÔNG THỂ TẢI HỒ SƠ ĐÁNH GIÁ</h3>
                        <p style="margin:0 0 16px;">${error.message || 'Mã hồ sơ không tồn tại hoặc phiên đánh giá đã kết thúc.'}</p>
                        <a href="/survey.html" class="btn-gov btn-gov-danger">Làm bài khảo sát mới →</a>
                    </div>
                `;
            }
        });

        function formatFacilityType(type) {
            if (!type) return 'Chưa phân loại';
            const dict = {
                'industrial': 'Cơ sở sản xuất công nghiệp',
                'warehouse': 'Kho hàng, kho vật liệu',
                'mixed_residence': 'Nhà ở kết hợp kinh doanh',
                'hospitality': 'Nhà hàng, khách sạn, chợ, TTTM',
                'medical_education': 'Bệnh viện, trường học, y tế',
                'fuel_gas': 'Xăng dầu, khí gas, vật liệu nổ',
                'transport': 'Phương tiện giao thông',
                'residential': 'Khu dân cư, nhà ở, nhà trọ',
                'construction': 'Công trình xây dựng',
                'office': 'Cơ quan, văn phòng, trụ sở',
                'laboratory': 'Nghiên cứu, phòng thí nghiệm',
                'agriculture': 'Nông nghiệp, chế biến nông lâm sản',
                'commercial': 'Trung tâm thương mại, siêu thị, chợ, cửa hàng',
                'gas_station': 'Cửa hàng kinh doanh xăng dầu, khí đốt hóa lỏng (LPG)',
                'karaoke': 'Cơ sở kinh doanh dịch vụ karaoke, vũ trường, quán bar',
                'educational': 'Cơ sở giáo dục, trường học, nhà trẻ, mầm non',
                'medical': 'Cơ sở khám chữa bệnh, bệnh viện, phòng khám'
            };
            return String(type).split(',').map(t => t.trim()).filter(Boolean)
                .map(t => dict[t.toLowerCase()] || t).join('; ');
        }

        // Mức nguy cơ cao hơn mức tương ứng với tỷ lệ % (do quy tắc cờ đỏ / nhóm trọng yếu)
        function isEscalated(data) {
            const rank = { low: 0, medium: 1, high: 2, critical: 3 };
            const p = data.risk_percentage;
            const byPct = p <= 20 ? 0 : p <= 45 ? 1 : p <= 70 ? 2 : 3;
            return (rank[data.risk_level] ?? 0) > byPct;
        }

        function parseMitigation(data) {
            if (!data || !data.mitigation_data) return null;
            try {
                return typeof data.mitigation_data === 'string' ? JSON.parse(data.mitigation_data) : data.mitigation_data;
            } catch (e) {
                return null;
            }
        }

        function renderResult(rawData) {
            const c = document.getElementById('result-container');
            if (!c) return;

            // Khi cơ sở cập nhật khắc phục, điểm của hồ sơ được thay bằng nguy cơ hiện tại (để đồng bộ bản đồ).
            // Trang kết quả khảo sát vẫn hiển thị kết quả gốc lúc khảo sát.
            const mitigation = parseMitigation(rawData);
            const data = mitigation && mitigation.initial_risk_percentage !== undefined
                ? { ...rawData,
                    risk_percentage: mitigation.initial_risk_percentage,
                    risk_level: mitigation.initial_risk_level || rawData.risk_level,
                    total_score: mitigation.initial_total_score ?? rawData.total_score }
                : rawData;

            const riskColors = { low: '#16a34a', medium: '#d97706', high: '#ea580c', critical: '#dc2626' };
            const riskLabels = { low: 'AN TOÀN / NGUY CƠ THẤP', medium: 'TRUNG BÌNH / CẦN CẢI THIỆN', high: 'NGUY CƠ CAO', critical: 'RẤT CAO / CẤP BÁO' };
            const riskColor = riskColors[data.risk_level] || '#0f172a';
            const riskText = riskLabels[data.risk_level] || 'CHƯA XÁC ĐỊNH';
            const cardClass = data.risk_level === 'critical' || data.risk_level === 'high' ? 'danger' : data.risk_level === 'medium' ? 'warning' : 'success';

            // Check if AI is already analyzed
            let aiObj = null;
            if (data.ai_analysis) {
                try {
                    aiObj = typeof data.ai_analysis === 'string' ? JSON.parse(data.ai_analysis) : data.ai_analysis;
                    aiObj = normalizeAiObject(aiObj);
                } catch (e) {
                    aiObj = null;
                }
            }

            c.innerHTML = `
            <div class="result-docket">
                <!-- DOCKET OFFICIAL HEADER -->
                <div class="docket-gov-header">
                    <div class="docket-emblem-group">
                        <img src="/img/logo-cand.png" alt="CAND" width="56" height="56" style="object-fit:contain;">
                        <div class="docket-titles">
                            <h2>CÔNG AN THÀNH PHỐ BẮC NINH</h2>
                            <p>Phòng Cảnh sát PCCC và Cứu nạn, cứu hộ • Hệ thống FRAS-AI</p>
                        </div>
                    </div>
                    <div class="docket-doc-meta">
                        <div>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</div>
                        <div style="font-size:0.75rem;">Độc lập - Tự do - Hạnh phúc</div>
                        <div style="margin-top:4px;">Số hồ sơ: <strong>FRAS-${(data.id || '').substring(0, 8).toUpperCase()}</strong></div>
                    </div>
                </div>

                <!-- DOCKET METADATA STRIP -->
                <div class="docket-meta-strip">
                    <div>
                        <div class="meta-field-label">Tên cơ sở / Công trình</div>
                        <div class="meta-field-value">${data.facility_name || 'Khảo sát tự do'}</div>
                    </div>
                    <div>
                        <div class="meta-field-label">Loại hình cơ sở</div>
                        <div class="meta-field-value">${formatFacilityType(data.facility_type)}</div>
                    </div>
                    <div>
                        <div class="meta-field-label">Địa chỉ</div>
                        <div class="meta-field-value">${data.facility_address || 'TP Bắc Ninh'}</div>
                    </div>
                    <div>
                        <div class="meta-field-label">Thời gian khảo sát</div>
                        <div class="meta-field-value">${formatDate(data.completed_at || data.created_at)}</div>
                    </div>
                    <div id="qr-code-box" style="text-align:right;">
                        <div style="width:72px; height:72px; background:#ffffff; border:1px solid #cbd5e1; display:flex; align-items:center; justify-content:center; font-size:0.75rem; color:#94a3b8; margin-left:auto;">QR CODE</div>
                    </div>
                </div>

                <div class="docket-body">
                    <!-- ACTIONS STRIP -->
                    <div class="result-actions-strip">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span class="badge-sharp ${cardClass}">KẾT QUẢ: ${riskText}</span>
                            <span style="font-size:0.82rem; color:#64748b;">(Căn cứ ma trận đánh giá 8 nhóm nguyên nhân cháy nổ)</span>
                        </div>
                        <div style="display:flex; gap:8px; flex-wrap:wrap;">
                            <button type="button" class="btn-gov btn-gov-outline" onclick="window.print()">In Biên bản</button>
                            <button type="button" class="btn-gov btn-gov-outline" onclick="exportPDF('${data.id}')">Xuất File PDF</button>
                            <button type="button" class="btn-gov" onclick="triggerForceAiAnalyze('${data.id}')" id="btn-force-ai">Phân tích lại bằng AI</button>
                            <a href="/survey.html" class="btn-gov btn-gov-danger">Khảo sát mới</a>
                        </div>
                    </div>

                    <!-- LƯU Ý KHẢO SÁT TRUNG THỰC -->
                    <div style="background:#fffbeb; border:1px solid #fef3c7; border-left:4px solid #d97706; padding:12px 16px; margin-bottom:20px; font-size:0.92rem; color:#92400e; line-height:1.5;">
                        ℹ️ <strong>Lưu ý quan trọng:</strong> Kết quả đánh giá dựa trên câu trả lời khảo sát của bạn, hãy khảo sát trung thực để đánh giá thực tế nhất nguy cơ cháy nổ của cơ sở.
                    </div>

                    <!-- 1. KEY METRICS CARDS -->
                    <div class="metrics-grid-sharp">
                        <div class="metric-card-sharp ${cardClass}">
                            <div class="metric-title-sharp">Tỷ lệ Nguy cơ Tổng hợp</div>
                            <div class="metric-value-sharp" style="color:${riskColor};">${data.risk_percentage}%</div>
                            <div class="metric-desc-sharp">
                                Mức độ: <strong style="color:${riskColor};">${riskText}</strong>.<br>
                                Thước đo tỷ lệ tích tụ hiểm họa cháy nổ tại cơ sở.
                            </div>
                        </div>

                        <div class="metric-card-sharp">
                            <div class="metric-title-sharp">Điểm Nguy cơ / Điểm Tối đa</div>
                            <div class="metric-value-sharp" style="color:#0f172a;">${data.total_score} <span style="font-size:1.2rem; font-weight:500; color:#64748b;">/ ${data.max_possible_score || 100}</span></div>
                            <div class="metric-desc-sharp">
                                Tổng điểm thô cộng từ các câu trả lời, chưa tính trọng số.<br>
                                <em>Tỷ lệ % nguy cơ đã tính trọng số theo nhóm nguyên nhân cháy nên không bằng điểm thô chia điểm tối đa.</em>
                            </div>
                        </div>

                        <div class="metric-card-sharp">
                            <div class="metric-title-sharp">Thời hạn Khắc phục Đề xuất</div>
                            <div class="metric-value-sharp" style="color:#b91c1c;">
                                ${data.risk_level === 'critical' || data.risk_level === 'high' ? 'Khắc phục ngay' : data.risk_level === 'medium' ? '30 - 60 ngày' : 'Định kỳ'}
                            </div>
                            <div class="metric-desc-sharp">
                                ${data.risk_level === 'critical' || data.risk_level === 'high' ? 'Khắc phục ngay (trong 24h - 48h) đối với các nguy cơ chập cháy điện và nguồn nhiệt.' : 'Thực hiện tự kiểm tra định kỳ và duy trì các điều kiện an toàn PCCC.'}
                            </div>
                        </div>
                    </div>

                    <!-- 2. EXPLANATION BOX: % NGUY CƠ NÀY LÀ THẾ NÀO? NÓI LÊN ĐIỀU GÌ? -->
                    <div class="risk-explainer-box">
                        <div class="risk-explainer-title">
                            HƯỚNG DẪN ĐỌC HIỂU: TỶ LỆ % NGUY CƠ NÀY LÀ GÌ VÀ THỂ HIỆN ĐIỀU GÌ?
                        </div>
                        <div class="risk-explainer-content">
                            <p style="margin:0 0 8px;">
                                <strong>Bản chất của chỉ số:</strong> Tỷ lệ <strong>${data.risk_percentage}% nguy cơ</strong> không phải là điểm số thi cử đạt/trượt, mà là <strong>thước đo mức độ tích tụ hiểm họa cháy nổ</strong> của công trình dựa trên ma trận xác suất thống kê thực tế tại Việt Nam (trong đó: <strong>sự cố hệ thống thiết bị điện chiếm hơn 50%</strong> trọng số các nguyên nhân gây ra cháy; <strong>bất cẩn nguồn lửa/nhiệt chiếm 15%</strong>... Tồn tại về lối thoát nạn và trang bị phương tiện PCCC là các điều kiện quyết định khả năng thoát nạn sống còn và hạn chế thiệt hại khi xảy ra hỏa hoạn, không phải nguyên nhân phát sinh cháy).
                            </p>
                            <p style="margin:0 0 10px;">
                                <strong>Quy tắc an toàn tính mạng:</strong> Dù tổng điểm nguy cơ của cơ sở có thể thấp, nhưng nếu xuất hiện bất kỳ nguy cơ nghiêm trọng nào tại các nhóm có tỷ lệ xảy ra cao (như sự cố chập cháy hệ thống điện, thiết bị phát nhiệt quá mức, rò rỉ khí gas, hoặc lối thoát nạn duy nhất bị bịt kín), hệ thống sẽ lập tức kích hoạt mức cảnh báo nguy cơ cao để chủ cơ sở không được chủ quan.
                            </p>

                            ${isEscalated(data) ? `
                            <p style="margin:0 0 10px; padding:8px 12px; background:#fff7ed; border:1px solid #fdba74; color:#9a3412;">
                                <strong>Mức nguy cơ được nâng lên:</strong> tỷ lệ chung là ${data.risk_percentage}% nhưng cơ sở có câu trả lời ở mức nghiêm trọng nhất hoặc có nhóm trọng yếu (điện, nguồn lửa/nhiệt, thoát nạn...) ở mức cao, nên hệ thống xếp vào mức <strong>${riskText}</strong>.
                            </p>` : ''}
                            <!-- 4-step scale -->
                            <div class="risk-scale-row">
                                <div class="risk-scale-step ${data.risk_level === 'low' ? 'active' : ''}" style="border-top: 4px solid #16a34a;">
                                    <span class="step-tag" style="color:#16a34a;">MỨC 1: 0% - 20% (AN TOÀN)</span>
                                    Tuân thủ tốt quy chuẩn PCCC, nguy cơ phát sinh cháy nổ ở mức tối thiểu.
                                </div>
                                <div class="risk-scale-step ${data.risk_level === 'medium' ? 'active' : ''}" style="border-top: 4px solid #d97706;">
                                    <span class="step-tag" style="color:#d97706;">MỨC 2: 21% - 45% (CẦN CẢI THIỆN)</span>
                                    Đã xuất hiện mầm mống rủi ro (quá tải điện nhẹ, thiếu bảo dưỡng thiết bị), cần tự chấn chỉnh sớm.
                                </div>
                                <div class="risk-scale-step ${data.risk_level === 'high' ? 'active' : ''}" style="border-top: 4px solid #ea580c;">
                                    <span class="step-tag" style="color:#ea580c;">MỨC 3: 46% - 70% (NGUY CƠ CAO)</span>
                                    Tồn tại vi phạm nghiêm trọng có thể trực tiếp phát sinh hỏa hoạn. Phải khắc phục ngay các nguy cơ điện/nhiệt trong 24h - 48h.
                                </div>
                                <div class="risk-scale-step ${data.risk_level === 'critical' ? 'active' : ''}" style="border-top: 4px solid #dc2626;">
                                    <span class="step-tag" style="color:#dc2626;">MỨC 4: 71% - 100% (CẤP BÁO)</span>
                                    Điều kiện an toàn cực kỳ nguy hiểm, nguy cơ cháy nổ tức thời đe dọa trực tiếp tính mạng con người!
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 3. DETAILED CATEGORY SCORES TABLE & BAR CHART (MOVED UP PER USER REQUEST) -->
                    ${data.category_scores && data.category_scores.length ? `
                    <div class="chart-panel-sharp" style="margin-bottom: 24px;">
                        <h4>Phân tích Tỷ lệ Nguy cơ theo Từng Nhóm Câu hỏi</h4>
                        <div style="height:${Math.max(260, data.category_scores.length * 36)}px; position:relative; margin-bottom: 20px;">
                            <canvas id="bar-chart"></canvas>
                        </div>

                        <h4>Bảng Thống kê Chi tiết các Nhóm Rà soát</h4>
                        <table class="category-table-sharp">
                            <thead>
                                <tr>
                                    <th style="width: 40px; text-align:center;">STT</th>
                                    <th>Nhóm Nguy cơ / Hạng mục rà soát</th>
                                    <th style="width: 140px; text-align:center;">Điểm ghi nhận</th>
                                    <th style="width: 120px; text-align:center;">Tỷ lệ nguy cơ</th>
                                    <th style="width: 150px; text-align:center;">Đánh giá</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.category_scores.map((cs, idx) => `
                                <tr>
                                    <td style="text-align:center; font-weight:700;">${idx + 1}</td>
                                    <td>
                                        <div style="font-weight:700; color:#0f172a;">${cs.category_name}</div>
                                    </td>
                                    <td style="text-align:center; font-weight:600;">
                                        ${cs.score_obtained} / ${cs.max_score} điểm
                                    </td>
                                    <td style="text-align:center; font-weight:800; color:${riskColors[cs.risk_level] || '#0f172a'}; font-size:0.95rem;">
                                        ${cs.percentage}%
                                    </td>
                                    <td style="text-align:center;">
                                        <span class="badge-sharp ${cs.risk_level === 'critical' || cs.risk_level === 'high' ? 'danger' : cs.risk_level === 'medium' ? 'warning' : 'success'}">
                                            ${cs.risk_level === 'low' ? 'NGUY CƠ THẤP' : cs.risk_level === 'medium' ? 'CẦN LƯU Ý' : 'NGUY HIỂM'}
                                        </span>
                                    </td>
                                </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                    ` : ''}

                    <!-- 4. RADAR & GAUGE CHARTS ROW -->
                    <div class="charts-row-sharp">
                        <div class="chart-panel-sharp">
                            <h4>Biểu đồ Radar Phân bổ Nguy cơ theo Các Trục</h4>
                            <div style="height: 320px; position:relative;">
                                <canvas id="radar-chart"></canvas>
                            </div>
                        </div>
                        <div class="chart-panel-sharp">
                            <h4>Thước đo Cấp độ Nguy cơ Cháy nổ</h4>
                            <div style="height: 250px; position:relative;">
                                <canvas id="gauge-chart"></canvas>
                            </div>
                            <div style="text-align:center; margin-top:10px; font-size:0.85rem; color:#64748b;">
                                Chỉ số thực tế: <strong style="color:${riskColor}; font-size:1.1rem;">${data.risk_percentage}%</strong> (${riskText})
                            </div>
                        </div>
                    </div>

                    <!-- 5. LIÊN KẾT SANG TRANG THEO DÕI KHẮC PHỤC -->
                    ${renderMitigationLinkCard(data, mitigation)}

                    <!-- 6. AI ANALYSIS & RECOMMENDATIONS SECTION -->
                    <div id="ai-main-container">
                        ${aiObj ? renderAiSectionHtml(aiObj) : renderAiLoadingHtml(data.id)}
                    </div>

                    <!-- FOOTER ACTIONS -->
                    <div style="display:flex; justify-content:center; gap:12px; margin-top:32px; padding-top:20px; border-top:1px solid #e2e8f0; flex-wrap:wrap;">
                        <a href="/history.html" class="btn-gov btn-gov-outline">Xem Lịch sử các bài đánh giá</a>
                        <a href="/survey.html" class="btn-gov btn-gov-danger">Thực hiện bài Khảo sát mới</a>
                        <button type="button" class="btn-gov" onclick="window.scrollTo({top:0, behavior:'smooth'})">Lên đầu trang</button>
                    </div>
                </div>
            </div>
            `;

            // Render Charts
            if (data.category_scores && data.category_scores.length) {
                setTimeout(() => {
                    createRadarChart('radar-chart', data.category_scores);
                    createRiskGauge('gauge-chart', data.risk_percentage, data.risk_level);
                    createBarChart('bar-chart', data.category_scores);
                }, 100);
            }

            // Load QR code
            loadDocketQRCode(data.id);

            // AUTO-TRIGGER AI IF NOT YET ANALYZED
            if (!aiObj && !isAiAnalyzing) {
                setTimeout(() => triggerAiAnalyze(data.id), 400);
            }
        }

        function renderAiLoadingHtml(id) {
            return `
            <div class="ai-command-section">
                <div class="ai-command-header">
                    <h3><span>📊</span> TRUNG TÂM PHÂN TÍCH CHUYÊN SÂU & THAM MƯU PCCC</h3>
                    <span style="font-size:0.8rem; background:rgba(255,255,255,0.15); padding:3px 10px;">AI ĐANG PHÂN TÍCH</span>
                </div>
                <div class="ai-tab-body">
                    <div class="ai-loading-box">
                        <div class="pulse-siren">🚨</div>
                        <h3 style="margin:16px 0 8px; font-weight:800; color:#0f172a; text-transform:uppercase;">
                            ĐANG TỰ ĐỘNG PHÂN TÍCH HỒ SƠ & TỔNG HỢP KHUYẾN CÁO...
                        </h3>
                        <p style="color:#64748b; font-size:0.9rem; max-width:680px; margin:0 auto 16px; line-height:1.5;">
                            Trí tuệ nhân tạo đang đọc kết quả khảo sát của cơ sở để viết nhận định, khuyến nghị và lộ trình khắc phục trong 90 ngày.
                        </p>
                        <div style="display:inline-flex; align-items:center; gap:8px; font-size:0.85rem; color:#b91c1c; font-weight:700;">
                            <div class="loading-spinner" style="width:20px; height:20px; border-width:2px;"></div>
                            Vui lòng đợi khoảng 1 phút...
                        </div>
                    </div>
                </div>
            </div>
            `;
        }

        async function triggerAiAnalyze(id, force = false) {
            if (isAiAnalyzing) return;
            isAiAnalyzing = true;

            const btnForce = document.getElementById('btn-force-ai');
            if (btnForce) {
                btnForce.disabled = true;
                btnForce.innerHTML = '⏳ Đang phân tích...';
            }

            try {
                const url = force ? `/ai/analyze/${id}?force=true` : `/ai/analyze/${id}`;
                const result = await api.post(url, {}, { timeoutMs: 98000 });
                const ai = result.analysis || result;

                // Update current assessment data
                if (currentAssessmentData) {
                    currentAssessmentData.ai_analysis = ai;
                }

                // Render into container
                const container = document.getElementById('ai-main-container');
                if (container) {
                    container.innerHTML = renderAiSectionHtml(ai);
                }

                if (btnForce) {
                    btnForce.disabled = false;
                    btnForce.innerHTML = '✅ Đã hoàn tất phân tích';
                }
            } catch (err) {
                console.error("AI Analysis failed:", err);
                const container = document.getElementById('ai-main-container');
                if (container) {
                    container.innerHTML = `
                    <div class="ai-command-section">
                        <div class="ai-command-header" style="background:#dc2626;">
                            <h3><span>⚠️</span> THÔNG BÁO TẠM THỜI VỀ PHÂN TÍCH AI</h3>
                        </div>
                        <div class="ai-tab-body" style="text-align:center; padding:24px;">
                            <p style="color:#dc2626; font-weight:700; margin:0 0 12px;">Chưa thể kết nối tới máy chủ AI: ${err.message || 'Hết thời gian chờ phản hồi'}</p>
                            <button type="button" class="btn-gov btn-gov-danger" onclick="triggerAiAnalyze('${id}', true)">
                                🔄 Bấm để thử phân tích lại ngay
                            </button>
                        </div>
                    </div>
                    `;
                }
                if (btnForce) {
                    btnForce.disabled = false;
                    btnForce.innerHTML = '🔄 Thử lại AI';
                }
            } finally {
                isAiAnalyzing = false;
            }
        }

        function triggerForceAiAnalyze(id) {
            triggerAiAnalyze(id, true);
        }

        function renderSingleEngineContent(ai, engineTitle, badgeText, badgeColor) {
            if (!ai) return '<p style="color:#64748b; padding:12px;">Đang cập nhật dữ liệu phân tích từ mô hình này...</p>';
            let h = '';

            if (engineTitle) {
                h += `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; padding-bottom:12px; border-bottom:2px solid #e2e8f0; flex-wrap:wrap; gap:8px;">
                    <div style="font-size:1.05rem; font-weight:800; color:#0f172a; text-transform:uppercase;">${engineTitle}</div>
                    <span class="badge-sharp info" style="color:${badgeColor}; border-color:${badgeColor};">${badgeText}</span>
                </div>`;
            }

            // Overall Assessment
            if (ai.overall_assessment) {
                h += `
                <div style="background:#f0f9ff; border:1px solid #bae6fd; border-left:6px solid #0284c7; padding:16px; margin-bottom:20px; font-size:0.92rem; color:#0369a1; line-height:1.6;">
                    <strong style="display:block; margin-bottom:4px; font-size:0.95rem; text-transform:uppercase;">NHẬN ĐỊNH TỔNG QUAN:</strong>
                    ${ai.overall_assessment}
                </div>`;
            }

            // Strengths -> Ưu điểm (Point 9)
            if (ai.strengths?.length) {
                h += `
                <div class="ai-h-tag success">ƯU ĐIỂM (${ai.strengths.length})</div>
                <ul style="padding-left:22px; margin:0 0 18px; color:#1e293b; font-size:0.88rem; line-height:1.6;">
                    ${ai.strengths.map(s => `<li style="margin-bottom:6px;">${s}</li>`).join('')}
                </ul>`;
            }

            // Critical Weaknesses / Hazards
            if (ai.critical_weaknesses?.length) {
                h += `
                <div class="ai-h-tag danger">TỒN TẠI & NGUY CƠ CHÁY NỔ TIỀM ẨN (${ai.critical_weaknesses.length})</div>
                <ul style="padding-left:22px; margin:0 0 20px; color:#991b1b; font-size:0.88rem; line-height:1.6;">
                    ${ai.critical_weaknesses.map(w => `<li style="margin-bottom:6px; font-weight:600;">${w}</li>`).join('')}
                </ul>`;
            }

            // Detailed Recommendations
            if (ai.detailed_recommendations?.length) {
                h += `<div class="ai-h-tag warning">KHUYẾN CÁO & GIẢI PHÁP KỸ THUẬT KHẮC PHỤC (${ai.detailed_recommendations.length} HẠNG MỤC)</div>`;
                const priorityLabels = {
                    'urgent': 'KHẨN CẤP (TRONG 24H - 48H)',
                    'high': 'ƯU TIÊN CAO',
                    'medium': 'TRUNG BÌNH',
                    'low': 'THẤP'
                };
                ai.detailed_recommendations.forEach((r, i) => {
                    const priorityClass = (r.priority || '').toLowerCase();
                    const priorityText = priorityLabels[priorityClass] || (r.priority || 'ƯU TIÊN').toUpperCase();
                    h += `
                    <div class="ai-recommendation-card ${priorityClass}">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; flex-wrap:wrap; gap:8px;">
                            <strong style="color:#0f172a; font-size:0.95rem;">${i + 1}. ${r.title || ''}</strong>
                            <span class="badge-sharp ${priorityClass === 'urgent' ? 'danger' : priorityClass === 'high' ? 'warning' : 'info'}">
                                ${priorityText}
                            </span>
                        </div>
                        <p style="color:#334155; font-size:0.88rem; margin:0 0 8px; line-height:1.5;">${r.description || ''}</p>
                        <div style="display:flex; flex-wrap:wrap; gap:12px; font-size:0.8rem; color:#64748b; font-weight:600;">
                            <span>Hạn hoàn thành: <strong style="color:#0f172a;">${r.deadline || (priorityClass === 'urgent' ? 'Khắc phục ngay trong 24h - 48h' : '30 ngày')}</strong></span>
                            ${r.responsible_party ? `<span>Phụ trách: <strong>${r.responsible_party}</strong></span>` : ''}
                        </div>
                        ${r.legal_basis ? `<div style="color:#7c3aed; font-size:0.78rem; font-weight:600; margin-top:6px;">Căn cứ pháp lý: ${r.legal_basis}</div>` : ''}
                    </div>`;
                });
            }

            // Daily Checklist (Point 6)
            if (ai.daily_checklist?.length) {
                h += `
                <div class="ai-h-tag primary">DANH MỤC TỰ KIỂM TRA AN TOÀN HÀNG NGÀY</div>
                <div style="background:#f8fafc; border:1px solid #cbd5e1; padding:16px; margin-bottom:20px;">
                    <ul style="padding-left:20px; margin:0; font-size:0.88rem; color:#1e293b; line-height:1.6;">
                        ${ai.daily_checklist.map(item => `<li style="margin-bottom:6px;"><strong>${item}</strong></li>`).join('')}
                    </ul>
                </div>`;
            }

            // 90-Day Improvement Plan (Point 8)
            if (ai.improvement_plan) {
                const p = ai.improvement_plan;
                const phases = [
                    { key: '30_days', label: 'GIAI ĐOẠN 1: KHẮC PHỤC NGAY (24H - 48H) VÀ 30 NGÀY ĐẦU (XỬ LÝ NGUY CƠ TRỰC TIẾP)', color: '#dc2626', desc: 'Triệt tiêu ngay các nguy cơ phát sinh cháy nổ nguy hiểm nhất (điện, thiết bị sinh nhiệt, rò rỉ gas), thông thoáng lối thoát nạn' },
                    { key: '60_days', label: 'GIAI ĐOẠN 2: 30 - 60 NGÀY (NÂNG CẤP HẠ TẦNG & TRANG THIẾT BỊ)', color: '#ea580c', desc: 'Kiểm định hệ thống điện, bảo dưỡng bình chữa cháy, huấn luyện kỹ năng PCCC cho nhân sự' },
                    { key: '90_days', label: 'GIAI ĐOẠN 3: 60 - 90 NGÀY (HOÀN THIỆN & DUY TRÌ BỀN VỮNG)', color: '#16a34a', desc: 'Rà soát hồ sơ quản lý PCCC, diễn tập phương án chữa cháy nội bộ, đánh giá lại định kỳ' },
                ];

                h += `<div class="ai-h-tag primary">KẾ HOẠCH HÀNH ĐỘNG KHẮC PHỤC CHI TIẾT (LỘ TRÌNH 90 NGÀY)</div>`;
                phases.forEach(phase => {
                    const items = p[phase.key];
                    if (!items?.length) return;
                    h += `
                    <div class="ai-phase-box">
                        <div class="ai-phase-header" style="background:${phase.color};">
                            ${phase.label}
                        </div>
                        <div style="padding:14px; background:#ffffff;">
                            <p style="color:#64748b; font-size:0.8rem; margin:0 0 10px; font-style:italic;">${phase.desc}</p>
                            ${items.map((item, idx) => {
                                if (typeof item === 'string') {
                                    return `
                                    <div style="display:flex; gap:8px; margin-bottom:8px; padding:8px 10px; background:#f8fafc; border:1px solid #e2e8f0; font-size:0.86rem;">
                                        <span style="color:${phase.color}; font-weight:800; min-width:20px;">${idx+1}.</span>
                                        <span style="color:#1e293b;">${item}</span>
                                    </div>`;
                                } else {
                                    return `
                                    <div style="margin-bottom:10px; padding:10px 12px; background:#f8fafc; border:1px solid #e2e8f0;">
                                        <div style="font-weight:700; color:#0f172a; font-size:0.88rem; margin-bottom:4px;">
                                            ${idx+1}. ${item.task || item.title || ''}
                                        </div>
                                        ${item.detail || item.description ? `<p style="color:#475569; font-size:0.82rem; margin:0 0 6px;">${item.detail || item.description}</p>` : ''}
                                        <div style="display:flex; flex-wrap:wrap; gap:10px; font-size:0.75rem; color:#64748b; font-weight:600;">
                                            ${item.responsible ? `<span>Phụ trách: <strong>${item.responsible}</strong></span>` : ''}
                                            ${item.legal_basis ? `<span style="color:#7c3aed;">Căn cứ: <strong>${item.legal_basis}</strong></span>` : ''}
                                        </div>
                                    </div>`;
                                }
                            }).join('')}
                        </div>
                    </div>`;
                });
            }

            // Căn cứ pháp lý: danh mục chuẩn do hệ thống quản lý (FRAS_LEGAL_REFERENCES trong export.js)
            h += `
                <div class="ai-h-tag primary">CĂN CỨ VĂN BẢN QUY PHẠM PHÁP LUẬT & TIÊU CHUẨN KỸ THUẬT HIỆN HÀNH</div>
                <ul style="padding-left:22px; color:#475569; font-size:0.82rem; line-height:1.6; margin:0 0 10px;">
                    ${FRAS_LEGAL_REFERENCES.map(r => `<li style="margin-bottom:4px;">${r}</li>`).join('')}
                </ul>`;

            return h;
        }

        // Bản cũ lưu hai luồng (gemini_38, rag_chroma): chỉ lấy một luồng để hiển thị
        function normalizeAiObject(ai) {
            if (ai && ai.dual_mode) return Object.assign({}, ai.gemini_38 || {}, ai);
            return ai;
        }

        function renderAiSectionHtml(rawAi) {
            const ai = normalizeAiObject(rawAi);
            return `
            <div class="ai-command-section">
                <div class="ai-command-header">
                    <h3>PHÂN TÍCH VÀ KHUYẾN CÁO CỦA TRÍ TUỆ NHÂN TẠO (AI)</h3>
                </div>
                <div class="ai-tab-body">
                    ${renderSingleEngineContent(ai, null, null, null)}
                </div>
            </div>
            `;
        }

        async function loadDocketQRCode(id) {
            try {
                const token = localStorage.getItem('fras_token') || localStorage.getItem('token');
                const baseUrl = '/api';
                const response = await fetch(`${baseUrl}/export/qrcode/${id}`, {
                    headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    const container = document.getElementById('qr-code-box');
                    if (container) {
                        container.innerHTML = `
                            <div style="text-align:right;">
                                <img src="${url}" alt="QR Code" style="width:72px; height:72px; border:1px solid #0f172a; display:block; margin-left:auto;">
                                <div style="font-size:0.6rem; color:#475569; margin-top:3px; font-weight:800; text-transform:uppercase;">MÃ CHỐNG LÀM GIẢ KHẢO SÁT</div>
                            </div>
                        `;
                    }
                }
            } catch (err) {
                console.warn("Could not load QR code:", err);
            }
        }

        function renderMitigationLinkCard(data, mitigation) {
            const levelText = { low: 'Nguy cơ Thấp', safe: 'Nguy cơ Thấp', medium: 'Nguy cơ Trung bình', high: 'Nguy cơ Cao', critical: 'Nguy cơ Rất cao' };
            const levelColor = { low: '#16a34a', safe: '#16a34a', medium: '#d97706', high: '#ea580c', critical: '#dc2626' };
            let status = 'Cơ sở chưa cập nhật kết quả khắc phục cho hồ sơ này.';
            if (mitigation && Array.isArray(mitigation.items) && ((mitigation.history || []).length || mitigation.items.some(it => it.resolved))) {
                const done = mitigation.items.filter(it => it.resolved).length;
                const lvl = mitigation.current_risk_level;
                status = `Đã khắc phục <strong>${done}/${mitigation.items.length}</strong> hạng mục. Nguy cơ hiện tại: <strong style="color:${levelColor[lvl] || '#0f172a'};">${mitigation.current_risk_percentage}% (${levelText[lvl] || lvl})</strong>.`;
            }
            setTimeout(() => renderTrackingBox(document.getElementById('tracking-box'), data.id), 0);
            return `
                    <div id="tracking-box" style="margin-bottom:14px;"></div>
                    <div style="background:#ffffff; border:1px solid #cbd5e1; border-top:4px solid #b91c1c; padding:18px 20px; margin-bottom:28px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;">
                        <div style="flex:1; min-width:260px;">
                            <div style="font-weight:800; color:#0f172a; text-transform:uppercase; margin-bottom:6px;">Theo dõi khắc phục tồn tại & nguy cơ</div>
                            <p style="color:#475569; font-size:0.88rem; margin:0; line-height:1.5;">
                                Kết quả trên trang này là kết quả tại thời điểm khảo sát. Tiến độ khắc phục được cập nhật thường xuyên ở trang riêng, mỗi lần cập nhật hệ thống tính lại nguy cơ và AI đưa ra nhận xét.<br>${status}
                            </p>
                        </div>
                        <a href="/mitigation.html?id=${data.id}" class="btn-gov btn-gov-danger">Cập nhật khắc phục →</a>
                    </div>`;
        }
    </script>
</body>
</html>
