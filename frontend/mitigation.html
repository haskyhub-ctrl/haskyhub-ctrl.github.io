<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theo dõi Khắc phục Tồn tại & Nguy cơ - FRAS AI | Công an TP Bắc Ninh</title>
    <link rel="stylesheet" href="/css/main.css?v=20261022_c1">
    <link rel="stylesheet" href="/css/dashboard.css?v=20261014_gov2">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/docket.css?v=20261022_c1">
    <style>
        .mt-picker { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
        .mt-picker select { flex:1; min-width:240px; padding:9px 10px; border:1px solid #94a3b8; background:#ffffff; color:#0f172a; font-size:0.9rem; }
        .mt-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; margin-bottom:18px; }
        .mt-box { background:#f8fafc; border:1px solid #e2e8f0; padding:12px 14px; }
        .mt-box-label { font-size:0.75rem; color:#64748b; font-weight:700; text-transform:uppercase; margin-bottom:4px; }
        .mt-box-value { font-size:1.4rem; font-weight:900; color:#0f172a; }
        .mt-box-sub { font-size:0.75rem; color:#64748b; }
        .mt-item { border:1px solid #e2e8f0; background:#fafafa; padding:14px; }
        .mt-item.done { border-color:#bbf7d0; background:#f0fdf4; }
        .mt-note { width:100%; padding:8px 10px; font-size:0.82rem; border:1px solid #cbd5e1; background:#ffffff; color:#0f172a; box-sizing:border-box; }
        .mt-history { width:100%; border-collapse:collapse; font-size:0.84rem; }
        .mt-history th { background:#0f172a; color:#ffffff; text-align:left; padding:8px 10px; font-size:0.75rem; text-transform:uppercase; }
        .mt-history td { padding:8px 10px; border:1px solid #e2e8f0; color:#1e293b; }
        .mt-section-title { font-weight:800; color:#0f172a; font-size:0.92rem; text-transform:uppercase; margin:0 0 10px; }
    </style>
</head>

<body>
    <nav class="navbar" style="border-bottom: 2px solid #b91c1c;">
        <div class="container">
            <a href="/" class="nav-brand">
                <span class="logo-icon"><img src="/img/logo-cand.png" alt="CAND" width="38" height="38" style="object-fit:contain;"></span>
                <div><span>FRAS</span><small>Công an thành phố Bắc Ninh • PCCC & CNCH</small></div>
            </a>
            <ul class="nav-links" id="nav-links"></ul>
            <div class="nav-user" id="nav-user"></div>
            <button class="nav-mobile-toggle">&#9776;</button>
        </div>
    </nav>

    <div class="page-content" style="padding-top: 85px;">
        <div class="container" style="max-width: 1180px;">
            <div class="result-docket">
                <div class="docket-gov-header">
                    <div class="docket-emblem-group">
                        <img src="/img/logo-cand.png" alt="CAND" width="56" height="56" style="object-fit:contain;">
                        <div class="docket-titles">
                            <h2>Theo dõi khắc phục tồn tại & nguy cơ</h2>
                            <p>Cập nhật thường xuyên • Hệ thống tính lại nguy cơ và AI nhận xét sau mỗi lần cập nhật</p>
                        </div>
                    </div>
                </div>
                <div class="docket-body" id="mt-root">
                    <div style="text-align:center; padding:60px 20px;">
                        <div class="loading-spinner"></div>
                        <p style="color:#64748b; margin-top:12px;">Đang tải dữ liệu khắc phục...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/api.js?v=20261021_t1"></script>
    <script>
        const LEVEL_TEXT = { safe: 'Nguy cơ Thấp', low: 'Nguy cơ Thấp', medium: 'Nguy cơ Trung bình', high: 'Nguy cơ Cao', critical: 'Nguy cơ Rất cao' };
        const LEVEL_COLOR = { safe: '#16a34a', low: '#16a34a', medium: '#d97706', high: '#ea580c', critical: '#dc2626' };
        const PRIORITY_BADGE = {
            urgent: '<span class="badge-sharp danger">Khẩn cấp (24h - 48h)</span>',
            high: '<span class="badge-sharp warning">Ưu tiên cao</span>',
            medium: '<span class="badge-sharp info">Trung bình</span>',
            low: '<span class="badge-sharp">Thấp</span>',
        };

        let assessments = [];
        let currentId = null;
        let currentData = null;

        function esc(v) {
            return String(v ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        }

        onReady(async () => {
            setupNavbar();

            // Liên kết theo dõi có kèm mã (#k=...): tự vào bằng mã rồi xóa mã khỏi thanh địa chỉ
            const hashCode = new URLSearchParams(location.hash.replace(/^#/, '')).get('k');
            if (hashCode) {
                try {
                    const t = await api.trackByCode(hashCode);
                    history.replaceState(null, '', `/mitigation.html?id=${t.assessment_id}`);
                } catch (e) {
                    showCodeEntry(e.message);
                    return;
                }
            }
            // Chưa có phiên: cho nhập mã theo dõi (người dân không tài khoản) hoặc đăng nhập (cơ sở diện quản lý)
            if (!api.isLoggedIn()) { showCodeEntry(); return; }

            const user = api.getUser();
            const isAdmin = user && (user.role === 'admin' || user.role === 'superadmin');
            const urlId = new URLSearchParams(location.search).get('id');

            try {
                const list = await api.get(isAdmin ? '/admin/assessments' : '/assessments?status=completed');
                assessments = (Array.isArray(list) ? list : (list.items || [])).filter(a => a.status === 'completed');
            } catch (e) {
                assessments = [];
            }

            if (!urlId && !assessments.length) {
                document.getElementById('mt-root').innerHTML = `
                    <div style="text-align:center; padding:40px 20px;">
                        <h3 style="margin:0 0 8px; color:#0f172a;">Chưa có bài khảo sát nào</h3>
                        <p style="color:#64748b;">Hãy thực hiện khảo sát trước, hệ thống sẽ lập danh mục tồn tại cần khắc phục.</p>
                        <a href="/survey.html" class="btn-gov btn-gov-danger">Thực hiện khảo sát</a>
                    </div>`;
                return;
            }
            // Mặc định chọn hồ sơ được yêu cầu, nếu không thì hồ sơ khảo sát mới nhất
            await loadAssessment(urlId || assessments[0].id);
        });

        function showCodeEntry(message) {
            document.getElementById('mt-root').innerHTML = `
                <div class="tracking-entry">
                    <h3 style="margin:0 0 6px; color:#0f172a;">Theo dõi khắc phục bằng mã</h3>
                    <p style="color:#475569; font-size:0.9rem; line-height:1.55; margin:0;">
                        Nhập mã theo dõi đã nhận sau khi khảo sát (dạng ABCD-EFGH-JK). Không cần tài khoản.
                    </p>
                    <form id="track-form">
                        <input type="text" id="track-code" placeholder="ABCD-EFGH-JK" maxlength="14" autocomplete="off" autocapitalize="characters">
                        <button type="submit" class="btn-gov btn-gov-danger" style="width:100%;">Vào theo dõi</button>
                    </form>
                    <div id="track-msg" style="color:#b91c1c; font-weight:700; font-size:0.88rem; min-height:22px; margin-top:8px;">${esc(message || '')}</div>
                    <p style="font-size:0.84rem; color:#64748b; margin:14px 0 0;">
                        Cơ sở thuộc diện quản lý PCCC: <a href="/login.html">đăng nhập bằng mã cơ sở</a> hoặc
                        <a href="/survey.html">làm khảo sát mới</a>.
                    </p>
                </div>`;
            document.getElementById('track-form').addEventListener('submit', async (ev) => {
                ev.preventDefault();
                const btn = ev.target.querySelector('button');
                btn.disabled = true;
                try {
                    const t = await api.trackByCode(document.getElementById('track-code').value);
                    location.href = `/mitigation.html?id=${t.assessment_id}`;
                } catch (err) {
                    document.getElementById('track-msg').textContent = err.message || 'Không vào được, vui lòng thử lại.';
                    btn.disabled = false;
                }
            });
        }

        async function loadAssessment(id) {
            currentId = id;
            const root = document.getElementById('mt-root');
            try {
                currentData = await api.get(`/assessments/${id}/mitigation`);
                if (!assessments.some(a => a.id === id)) {
                    try {
                        const a = await api.get(`/assessments/${id}`);
                        assessments.unshift(a);
                    } catch (e) { /* bỏ qua, vẫn hiển thị danh mục */ }
                }
                render();
                renderTrackingBox(document.getElementById('mt-tracking-box'), id);
                history.replaceState(null, '', `/mitigation.html?id=${id}`);
            } catch (err) {
                root.innerHTML = `
                    <div style="background:#fef2f2; border:2px solid #dc2626; color:#991b1b; padding:20px; text-align:center;">
                        <strong>Không tải được danh mục khắc phục.</strong>
                        <p style="margin:8px 0 12px;">${esc(err.message || 'Lỗi kết nối')}</p>
                        <button type="button" class="btn-gov btn-gov-outline" onclick="loadAssessment('${esc(id)}')">Thử lại</button>
                    </div>`;
            }
        }

        function render() {
            const d = currentData;
            const items = d.items || [];
            const done = items.filter(it => it.resolved).length;
            const pct = items.length ? Math.round(done / items.length * 100) : 0;
            const lvl = d.current_risk_level || 'medium';
            const color = LEVEL_COLOR[lvl] || '#0f172a';
            const current = assessments.find(a => a.id === currentId) || {};

            const options = assessments.map(a => `
                <option value="${esc(a.id)}" ${a.id === currentId ? 'selected' : ''}>
                    ${esc(a.facility_name)} • Khảo sát ${formatDate(a.completed_at || a.created_at)}
                </option>`).join('');

            let h = `
                <div class="mt-picker">
                    <label for="mt-select" style="font-weight:700; color:#0f172a; font-size:0.88rem;">Hồ sơ khảo sát:</label>
                    <select id="mt-select" onchange="loadAssessment(this.value)">${options}</select>
                    <a href="/result.html?id=${esc(currentId)}" class="btn-gov btn-gov-outline">Xem kết quả khảo sát</a>
                    <a href="/survey.html" class="btn-gov">Khảo sát lại</a>
                </div>
                <div id="mt-tracking-box"></div>
                <p style="color:#64748b; font-size:0.86rem; margin:0 0 16px; line-height:1.5;">
                    Cơ sở khắc phục xong hạng mục nào thì tích chọn, ghi rõ cách đã xử lý và bấm <strong>Lưu tiến độ</strong>.
                    Hệ thống chấm lại các câu đã khắc phục theo đúng công thức của bài khảo sát, cập nhật cho cơ quan quản lý và AI đưa ra nhận xét.
                    Khi khảo sát lại, hệ thống lập hồ sơ mới và trang này tự chọn hồ sơ mới nhất.
                </p>

                <div class="mt-grid">
                    <div class="mt-box">
                        <div class="mt-box-label">Tỷ lệ nguy cơ khi khảo sát</div>
                        <div class="mt-box-value">${d.initial_risk_percentage}%</div>
                        <div class="mt-box-sub">${LEVEL_TEXT[d.initial_risk_level] || ''} • ${d.initial_total_score} điểm</div>
                    </div>
                    <div class="mt-box" style="border-left:4px solid ${color};">
                        <div class="mt-box-label">Tỷ lệ nguy cơ hiện tại</div>
                        <div class="mt-box-value" style="color:${color};">${d.current_risk_percentage}%</div>
                        <div class="mt-box-sub" style="color:${color}; font-weight:700;">${LEVEL_TEXT[lvl] || lvl}</div>
                    </div>
                    <div class="mt-box">
                        <div class="mt-box-label">Tiến độ khắc phục</div>
                        <div class="mt-box-value" style="color:#16a34a;" id="mt-progress">${done}/${items.length} <span style="font-size:0.9rem; color:#64748b;">(${pct}%)</span></div>
                        <div class="mt-box-sub">${d.last_updated ? 'Cập nhật: ' + formatDateTime(d.last_updated + (d.last_updated.endsWith('Z') ? '' : 'Z')) : 'Chưa cập nhật'}</div>
                    </div>
                </div>
                <div style="height:10px; background:#e2e8f0; margin-bottom:20px;">
                    <div id="mt-bar" style="height:100%; width:${pct}%; background:${pct === 100 ? '#16a34a' : '#2563eb'}; transition:width 0.3s;"></div>
                </div>`;

            // Nhận xét AI
            if (d.ai_feedback) {
                const fromAi = d.ai_feedback_source === 'ai';
                h += `
                <div style="background:#f0fdf4; border:1px solid #bbf7d0; border-left:5px solid #16a34a; padding:16px; margin-bottom:22px; font-size:0.88rem; color:#166534; line-height:1.6;">
                    <strong style="display:block; margin-bottom:4px; text-transform:uppercase; color:#15803d;">
                        ${fromAi ? 'Nhận xét của AI về tiến độ khắc phục' : 'Nhận xét của hệ thống'}
                    </strong>
                    ${esc(d.ai_feedback).replace(/\n/g, '<br>')}
                </div>`;
            }

            // Danh mục tồn tại
            h += `<div class="mt-section-title">Danh mục các tồn tại, nguy cơ cần khắc phục (${items.length} hạng mục)</div>
                <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:18px;">`;
            if (!items.length) {
                h += `<p style="color:#64748b;">Hồ sơ này chưa có hạng mục cần khắc phục.</p>`;
            }
            items.forEach((it, i) => {
                const ok = !!it.resolved;
                h += `
                <div class="mt-item ${ok ? 'done' : ''}" id="mt-item-${it.id}">
                    <div style="display:flex; align-items:flex-start; gap:12px;">
                        <input type="checkbox" id="mt-chk-${it.id}" class="mt-chk" data-id="${it.id}" ${ok ? 'checked' : ''} style="width:20px; height:20px; margin-top:2px; accent-color:#16a34a; cursor:pointer;" onchange="previewProgress()">
                        <div style="flex:1;">
                            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:4px;">
                                <label for="mt-chk-${it.id}" style="font-weight:700; color:#0f172a; font-size:0.92rem; cursor:pointer; margin:0;">${i + 1}. ${esc(it.title)}</label>
                                <div style="display:flex; gap:6px;">
                                    ${PRIORITY_BADGE[it.priority] || PRIORITY_BADGE.medium}
                                    <span class="badge-sharp ${ok ? 'success' : 'danger'}" id="mt-status-${it.id}">${ok ? 'Đã khắc phục' : 'Chưa xử lý'}</span>
                                </div>
                            </div>
                            ${it.description ? `<p style="color:#475569; font-size:0.84rem; margin:0 0 6px; line-height:1.5;">${esc(it.description)}</p>` : ''}
                            <div style="display:flex; flex-wrap:wrap; gap:12px; font-size:0.78rem; color:#64748b; margin-bottom:8px;">
                                <span>Thời hạn: <strong style="color:#0f172a;">${esc(it.deadline || 'Trong 30 ngày')}</strong></span>
                                ${it.legal_basis ? `<span style="color:#7c3aed;">Căn cứ: <strong>${esc(it.legal_basis)}</strong></span>` : ''}
                                ${it.resolved_at ? `<span style="color:#16a34a;">Xác nhận: ${formatDateTime(it.resolved_at + (it.resolved_at.endsWith('Z') ? '' : 'Z'))}</span>` : ''}
                            </div>
                            <input type="text" id="mt-note-${it.id}" class="mt-note" value="${esc(it.notes)}" placeholder="Ghi chú cách đã khắc phục (VD: đã thay dây dẫn, lắp aptomat chống giật...)">
                        </div>
                    </div>
                </div>`;
            });
            h += `</div>
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; padding-top:14px; border-top:1px solid #e2e8f0; margin-bottom:26px;">
                    <em style="font-size:0.82rem; color:#64748b;">* Chỉ tích các hạng mục đã xử lý thực tế. Cơ quan Công an có thể kiểm tra đối chiếu.</em>
                    <button type="button" class="btn-gov btn-gov-danger" id="mt-save" onclick="saveProgress()" ${items.length ? '' : 'disabled'}>Lưu tiến độ & cập nhật nguy cơ</button>
                </div>`;

            // Lịch sử cập nhật
            const hist = (d.history || []).slice().reverse();
            h += `<div class="mt-section-title">Lịch sử cập nhật</div>`;
            if (!hist.length) {
                h += `<p style="color:#64748b; font-size:0.86rem;">Chưa có lần cập nhật nào.</p>`;
            } else {
                h += `<div style="overflow-x:auto;"><table class="mt-history">
                    <thead><tr><th>Thời gian</th><th>Đã khắc phục</th><th>Tỷ lệ nguy cơ</th><th>Mức nguy cơ</th><th>Người cập nhật</th></tr></thead>
                    <tbody>${hist.map(x => `
                        <tr>
                            <td>${formatDateTime(x.at + (x.at.endsWith('Z') ? '' : 'Z'))}</td>
                            <td>${x.resolved}/${x.total}</td>
                            <td style="font-weight:800; color:${LEVEL_COLOR[x.risk_level] || '#0f172a'};">${x.risk_percentage}%</td>
                            <td>${LEVEL_TEXT[x.risk_level] || esc(x.risk_level)}</td>
                            <td>${esc(x.by || '')}</td>
                        </tr>`).join('')}
                    </tbody></table></div>`;
            }

            document.getElementById('mt-root').innerHTML = h;
        }

        function previewProgress() {
            const boxes = document.querySelectorAll('.mt-chk');
            let done = 0;
            boxes.forEach(cb => {
                const id = cb.dataset.id;
                const badge = document.getElementById(`mt-status-${id}`);
                document.getElementById(`mt-item-${id}`).classList.toggle('done', cb.checked);
                if (cb.checked) done++;
                if (badge) {
                    badge.className = 'badge-sharp ' + (cb.checked ? 'success' : 'danger');
                    badge.textContent = cb.checked ? 'Đã khắc phục (chưa lưu)' : 'Chưa xử lý';
                }
            });
            const pct = boxes.length ? Math.round(done / boxes.length * 100) : 0;
            document.getElementById('mt-bar').style.width = pct + '%';
            document.getElementById('mt-progress').innerHTML = `${done}/${boxes.length} <span style="font-size:0.9rem; color:#64748b;">(${pct}%)</span>`;
        }

        async function saveProgress() {
            const btn = document.getElementById('mt-save');
            btn.disabled = true;
            btn.textContent = 'Đang lưu, AI đang nhận xét...';
            const items = [...document.querySelectorAll('.mt-chk')].map(cb => {
                const id = parseInt(cb.dataset.id, 10);
                const note = document.getElementById(`mt-note-${id}`);
                return { id, resolved: cb.checked, notes: note ? note.value.trim() : '' };
            });
            try {
                currentData = await api.post(`/assessments/${currentId}/mitigation`, { items }, { timeoutMs: 90000 });
                render();
                showToast('Đã lưu tiến độ và tính lại mức nguy cơ', 'success');
            } catch (err) {
                showToast('Không lưu được tiến độ: ' + (err.message || 'Lỗi kết nối'), 'error');
                btn.disabled = false;
                btn.textContent = 'Lưu tiến độ & cập nhật nguy cơ';
            }
        }
    </script>
</body>

</html>
