<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - FRAS</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .auth-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }

        .auth-card .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-card .logo .icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 8px;
        }

        .auth-card .logo h2 {
            font-size: 1.4rem;
        }

        .auth-card .logo p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div class="auth-page">
        <div class="auth-card fade-in">
            <div class="logo">
                <span class="icon"></span>
                <h2>Đăng nhập FRAS</h2>
                <p>Hệ thống Đánh giá Nguy cơ Cháy Nổ</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Mã cơ sở (13 số) hoặc Email</label>
                    <input type="text" class="form-control" id="email" placeholder="Nhập mã cơ sở (VD: 2426200091153) hoặc Email" required>
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" class="form-control" id="password" placeholder="Mặc định cơ sở: Pc07@123" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; margin-top: 8px;">Đăng nhập</button>
            </form>
            <div class="auth-footer">
                Chưa có tài khoản? <a href="/register.html">Đăng ký tại đây</a>
            </div>
            <div style="text-align:center; margin-top:16px;">
                <a href="/" style="font-size:0.85rem; color:var(--text-muted);">← Quay về trang chủ</a>
            </div>
        </div>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        onReady(() => {
            if (api.isLoggedIn()) {
                const u = api.getUser();
                if (u && (u.role === 'admin' || u.role === 'superadmin')) {
                    window.location.href = '/admin/';
                } else if (u && u.facility_code) {
                    window.location.href = '/survey.html?role=facility';
                } else {
                    window.location.href = '/survey.html';
                }
            }
            setupLoginForm();
        });
    </script>
</body>

</html>
