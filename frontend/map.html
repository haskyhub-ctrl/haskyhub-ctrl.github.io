<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ Nguy cơ Cháy Nổ - FRAS</title>
    <link rel="stylesheet" href="/css/main.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <style>
        .map-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - var(--nav-height));
            padding-top: var(--nav-height);
        }

        .map-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 12px;
        }

        .map-toolbar h2 {
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .map-filters {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .filter-btn:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: var(--accent-orange);
            border-color: var(--accent-orange);
            color: white;
        }

        .filter-btn.filter-low.active {
            background: #22c55e;
            border-color: #22c55e;
        }

        .filter-btn.filter-medium.active {
            background: #eab308;
            border-color: #eab308;
            color: #1a1a2e;
        }

        .filter-btn.filter-high.active {
            background: #f97316;
            border-color: #f97316;
        }

        .filter-btn.filter-critical.active {
            background: #ef4444;
            border-color: #ef4444;
        }

        .filter-btn.filter-unassessed.active {
            background: #94a3b8;
            border-color: #94a3b8;
            color: #1a1a2e;
        }

        .map-stats {
            display: flex;
            gap: 16px;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .map-stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .map-stats .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        #map {
            flex: 1;
            z-index: 1;
        }

        /* Override Leaflet popup styles for dark theme */
        .leaflet-popup-content-wrapper {
            background: var(--bg-card, #1e293b);
            color: var(--text-primary, #f1f5f9);
            border-radius: 10px;
            border: 1px solid var(--border-color, #334155);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .leaflet-popup-tip {
            background: var(--bg-card, #1e293b);
            border: 1px solid var(--border-color, #334155);
        }

        .leaflet-popup-content {
            margin: 14px 16px;
            font-family: inherit;
            line-height: 1.6;
        }

        .popup-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary, #f1f5f9);
        }

        .popup-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.84rem;
            padding: 3px 0;
        }

        .popup-label {
            color: var(--text-muted, #94a3b8);
        }

        .popup-value {
            font-weight: 600;
        }

        .popup-risk {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .popup-risk-low {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .popup-risk-medium {
            background: rgba(234, 179, 8, 0.2);
            color: #eab308;
        }

        .popup-risk-high {
            background: rgba(249, 115, 22, 0.2);
            color: #f97316;
        }

        .popup-risk-critical {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .map-empty-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 32px 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .map-empty-msg h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .map-empty-msg p {
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        /* Custom Leaflet tile styling for dark mode */
        .leaflet-tile-pane {
            filter: brightness(0.7) contrast(1.2) saturate(0.8);
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="nav-brand"><span class="logo-icon">🔥</span>
                <div><span>FRAS</span><small>Đánh giá Nguy cơ Cháy Nổ</small></div>
            </a>
            <ul class="nav-links" id="nav-links">
                <li><a href="/">Trang chủ</a></li>
            </ul>
            <div class="nav-user" id="nav-user"></div>
        </div>
    </nav>

    <div class="map-container">
        <div class="map-toolbar">
            <h2>📍 Bản đồ Nguy cơ Cháy Nổ</h2>
            <div class="map-filters">
                <button class="filter-btn active" onclick="filterMap('')" id="filter-all">Tất cả</button>
                <button class="filter-btn filter-low" onclick="filterMap('low')" id="filter-low">🟢 Thấp</button>
                <button class="filter-btn filter-medium" onclick="filterMap('medium')" id="filter-medium">🟡 Trung
                    bình</button>
                <button class="filter-btn filter-high" onclick="filterMap('high')" id="filter-high">🟠 Cao</button>
                <button class="filter-btn filter-critical" onclick="filterMap('critical')" id="filter-critical">🔴 Rất
                    cao</button>
                <button class="filter-btn filter-unassessed" onclick="filterMap('unassessed')" id="filter-unassessed">⚪
                    Chưa
                    đánh giá</button>
            </div>
            <div class="map-stats" id="map-stats"></div>
        </div>
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="/js/api.js"></script>
    <script>
        let map;
        let markerClusterGroup;
        let allMarkers = [];
        let allData = [];
        let activeFilter = '';

        const riskColors = {
            low: '#22c55e',
            medium: '#eab308',
            high: '#f97316',
            critical: '#ef4444',
            unassessed: '#94a3b8'
        };

        const riskLabels = {
            low: 'Nguy cơ Thấp',
            medium: 'Nguy cơ Trung bình',
            high: 'Nguy cơ Cao',
            critical: 'Nguy cơ Rất cao',
            unassessed: 'Chưa đánh giá'
        };

        function initMap() {
            // Center on Vietnam
            map = L.map('map').setView([16.0, 106.5], 6);

            // Use OpenStreetMap tiles
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
                maxZoom: 19,
            }).addTo(map);

            markerClusterGroup = L.markerClusterGroup({
                maxClusterRadius: 50,
                spiderfyOnMaxZoom: true,
                showCoverageOnHover: false,
                iconCreateFunction: function (cluster) {
                    const count = cluster.getChildCount();
                    let size = 'small';
                    if (count > 10) size = 'medium';
                    if (count > 30) size = 'large';
                    return L.divIcon({
                        html: `<div class="cluster-marker cluster-${size}">${count}</div>`,
                        className: 'custom-cluster-icon',
                        iconSize: L.point(40, 40)
                    });
                }
            });
            map.addLayer(markerClusterGroup);

            loadMapData();
        }

        function createMarkerIcon(riskLevel) {
            const color = riskColors[riskLevel] || '#94a3b8';
            return L.divIcon({
                className: 'custom-marker',
                html: `<div style="
                    width: 28px; height: 28px;
                    background: ${color};
                    border: 3px solid white;
                    border-radius: 50%;
                    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
                "></div>`,
                iconSize: [28, 28],
                iconAnchor: [14, 14],
                popupAnchor: [0, -16]
            });
        }

        async function loadMapData() {
            try {
                const url = '/admin/map-data' + (activeFilter ? `?risk_level=${activeFilter}` : '');
                allData = await api.get(url);
                renderMarkers(allData);
                updateStats(allData);
            } catch (err) {
                console.error('Error loading map data:', err);
                // Show message if no auth or error
                if (err.message.includes('hết hạn') || err.message.includes('401')) {
                    showToast('Vui lòng đăng nhập với tài khoản admin để xem bản đồ', 'error');
                }
            }
        }

        function renderMarkers(data) {
            markerClusterGroup.clearLayers();
            allMarkers = [];

            if (data.length === 0) {
                return;
            }

            data.forEach(item => {
                const marker = L.marker([item.latitude, item.longitude], {
                    icon: createMarkerIcon(item.risk_level)
                });

                const riskClass = `popup-risk-${item.risk_level}`;
                const popup = `
                    <div class="popup-title">${item.facility_name}</div>
                    <div class="popup-row">
                        <span class="popup-label">Địa chỉ:</span>
                        <span class="popup-value">${item.facility_address || 'N/A'}</span>
                    </div>
                    <div class="popup-row">
                        <span class="popup-label">Loại cơ sở:</span>
                        <span class="popup-value">${item.facility_type || 'N/A'}</span>
                    </div>
                    <div class="popup-row">
                        <span class="popup-label">Tỷ lệ nguy cơ:</span>
                        <span class="popup-value" style="color:${riskColors[item.risk_level]}">${item.risk_percentage}%</span>
                    </div>
                    <div class="popup-row">
                        <span class="popup-label">Mức nguy cơ:</span>
                        <span class="popup-risk ${riskClass}">${riskLabels[item.risk_level]}</span>
                    </div>
                    <div class="popup-row">
                        <span class="popup-label">Điểm:</span>
                        <span class="popup-value">${item.total_score}/${item.max_possible_score}</span>
                    </div>
                    <div class="popup-row">
                        <span class="popup-label">Tổ chức:</span>
                        <span class="popup-value">${item.organization || 'N/A'}</span>
                    </div>
                    <div class="popup-row">
                        <span class="popup-label">Ngày đánh giá:</span>
                        <span class="popup-value">${item.completed_at ? new Date(item.completed_at).toLocaleDateString('vi-VN') : 'N/A'}</span>
                    </div>
                `;

                marker.bindPopup(popup, { maxWidth: 320 });
                allMarkers.push(marker);
                markerClusterGroup.addLayer(marker);
            });

            // Fit bounds if markers exist
            if (allMarkers.length > 0) {
                const group = L.featureGroup(allMarkers);
                map.fitBounds(group.getBounds().pad(0.1));
            }
        }

        function updateStats(data) {
            const statsDiv = document.getElementById('map-stats');
            const counts = { low: 0, medium: 0, high: 0, critical: 0 };
            data.forEach(d => { counts[d.risk_level] = (counts[d.risk_level] || 0) + 1; });

            statsDiv.innerHTML = `
                <span>📊 Tổng: <strong>${data.length}</strong></span>
                <span><span class="dot" style="background:#22c55e"></span> ${counts.low}</span>
                <span><span class="dot" style="background:#eab308"></span> ${counts.medium}</span>
                <span><span class="dot" style="background:#f97316"></span> ${counts.high}</span>
                <span><span class="dot" style="background:#ef4444"></span> ${counts.critical}</span>
                <span><span class="dot" style="background:#94a3b8"></span> ${counts.unassessed || 0}</span>
            `;
        }

        function filterMap(level) {
            activeFilter = level;

            // Update button states
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (level) {
                document.getElementById('filter-' + level).classList.add('active');
            } else {
                document.getElementById('filter-all').classList.add('active');
            }

            loadMapData();
        }

        // Init
        onReady(() => {
            setupNavbar();
            if (requireAuth()) {
                initMap();
            }
        });
    </script>
</body>

</html>
