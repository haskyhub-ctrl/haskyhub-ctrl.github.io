<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả Đánh giá - FRAS</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .ai-dual-container {
            margin-top: 24px;
        }
        .ai-tab-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
            flex-wrap: wrap;
        }
        .ai-tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-secondary);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .ai-tab-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }
        .ai-tab-btn.active {
            background: #dc2626;
            border-color: #dc2626;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35);
        }
        .ai-compare-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 992px) {
            .ai-compare-grid {
                grid-template-columns: 1fr;
            }
        }
        .ai-compare-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
        }
        .ai-compare-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 16px;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="nav-brand"><span class="logo-icon"><img src="/img/logo-cand.png" alt="CAND" width="36" height="36" style="object-fit:contain;filter:brightness(0) invert(1);"></span>
                <div><span>FRAS</span><small>Đánh giá Nguy cơ Cháy Nổ</small></div>
            </a>
            <ul class="nav-links" id="nav-links"></ul>
            <div class="nav-user" id="nav-user"></div>
            <button class="nav-mobile-toggle">&#9776;</button>
        </div>
    </nav>

    <div class="page-content">
        <div class="container" id="result-container">
            <div style="text-align:center; padding:60px;">
                <div class="loading-spinner"></div>
                <p class="mt-2" style="color:var(--text-secondary)">Đang tải kết quả...</p>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/charts.js"></script>
    <script src="/js/export.js"></script>
    <script>
        onReady(async () => {
            setupNavbar();
            if (!requireAuth()) return;
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (!id) { window.location.href = '/history.html'; return; }
            try {
                const data = await api.get(`/assessments/${id}`);
                renderResult(data);
            } catch (error) {
                document.getElementById('result-container').innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
            }
        });

        function renderResult(data) {
            const c = document.getElementById('result-container');
            const riskColors = { low: '#22c55e', medium: '#eab308', high: '#f97316', critical: '#ef4444' };
            const riskColor = riskColors[data.risk_level] || '#94a3b8';

            let aiHtml = '';
            if (data.ai_analysis) {
                try {
                    const ai = typeof data.ai_analysis === 'string' ? JSON.parse(data.ai_analysis) : data.ai_analysis;
                    aiHtml = buildAiSection(ai);
                } catch (e) { aiHtml = ''; }
            }

            c.innerHTML = `
        <div class="page-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
            <div style="display:flex; align-items:center; gap:20px;">
                <div id="qr-code-container" style="display:flex; align-items:center;">
                    <div style="width:80px; height:80px; border-radius:0; background:rgba(255,255,255,0.1); border:1px solid var(--border-color); display:flex; align-items:center; justify-content:center; font-size:0.8rem; color:var(--text-muted)">QR</div>
                </div>
                <div>
                    <h1 class="fade-in">📊 Kết quả Đánh giá</h1>
                    <p style="color:var(--text-secondary);">${data.facility_name} • ${formatDate(data.completed_at)}</p>
                </div>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button class="btn btn-outline" onclick="exportPDF('${data.id}')">📄 Xuất PDF</button>
                <button class="btn btn-primary" onclick="requestAI('${data.id}')" id="btn-ai">🤖 Trợ lý Chi phân tích</button>
            </div>
        </div>

        <div class="stats-grid fade-in" style="display:grid; grid-template-columns: repeat(3, 1fr); gap:20px;">
            <div class="stat-card"><div class="stat-icon">📊</div><div class="stat-value" style="color:${riskColor};">${data.risk_percentage}%</div><div class="stat-label">Tỷ lệ nguy cơ</div></div>
            <div class="stat-card"><div class="stat-icon">🔥</div><div class="stat-value">${data.total_score}/${data.max_possible_score}</div><div class="stat-label">Tổng điểm</div></div>
            <div class="stat-card"><div class="stat-icon">⚡</div><div class="stat-value">${getRiskBadge(data.risk_level)}</div><div class="stat-label">Mức nguy cơ</div></div>
        </div>

        <div style="display:grid; grid-template-columns: 1.5fr 1fr; gap:20px; margin-top:20px;" class="fade-in">
            <div class="dashboard-section">
                <div class="section-title"><h3>📈 Biểu đồ Radar</h3></div>
                <div class="chart-container"><canvas id="radar-chart"></canvas></div>
            </div>
            <div class="dashboard-section">
                <div class="section-title"><h3>🎯 Mức độ Nguy cơ</h3></div>
                <div class="chart-container" style="height:250px;"><canvas id="gauge-chart"></canvas></div>
            </div>
        </div>

        ${data.category_scores && data.category_scores.length ? `
        <div class="dashboard-section mt-3 fade-in">
            <div class="section-title"><h3>📊 Điểm theo Nhóm</h3></div>
            <div class="chart-container" style="height:${Math.max(300, data.category_scores.length * 35)}px;"><canvas id="bar-chart"></canvas></div>
        </div>
        <div class="dashboard-section mt-3 fade-in">
            <div class="section-title"><h3>📋 Chi tiết theo Nhóm</h3></div>
            ${data.category_scores.map(cs => `
                <div style="display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid rgba(255,255,255,0.05);">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <span style="font-size:1.3rem;">${cs.category_icon || '📋'}</span>
                        <div>
                            <div style="font-weight:600;">${cs.category_name}</div>
                            <div style="font-size:0.82rem; color:var(--text-muted);">${cs.score_obtained}/${cs.max_score} điểm</div>
                        </div>
                    </div>
                    <div style="text-align:right;">
                        <div style="font-weight:700; color:${riskColors[cs.risk_level] || '#94a3b8'};">${cs.percentage}%</div>
                        ${getRiskBadge(cs.risk_level)}
                    </div>
                </div>
            `).join('')}
        </div>` : ''}



        ${aiHtml}

        <div id="ai-result-container"></div>

        <div style="text-align:center; margin-top:32px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
            <a href="/history.html" class="btn btn-secondary">📋 Lịch sử Đánh giá</a>
            <a href="/survey.html" class="btn btn-primary">🔥 Đánh giá mới</a>
        </div>`;

            if (data.category_scores && data.category_scores.length) {
                setTimeout(() => {
                    createRadarChart('radar-chart', data.category_scores);
                    createRiskGauge('gauge-chart', data.risk_percentage, data.risk_level);
                    createBarChart('bar-chart', data.category_scores);
                }, 100);
            }

            // Auto-trigger AI analysis if not already done
            if (!data.ai_analysis) {
                setTimeout(() => requestAI(data.id), 500);
            }

            // Load QR Code
            setTimeout(() => loadQRCode(data.id), 200);
        }

        async function loadQRCode(id) {
            try {
                // Determine base URL since api.js might not export it directly
                const token = localStorage.getItem('token');
                const baseUrl = typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : '/api';
                const response = await fetch(`${baseUrl}/export/qrcode/${id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    const container = document.getElementById('qr-code-container');
                    if(container) {
                        container.innerHTML = `<img src="${url}" alt="QR" style="width:80px; height:80px; border-radius:0; border:4px solid white; background:white;">`;
                    }
                }
            } catch (err) {
                console.error("Failed to load QR code:", err);
            }
        }



        function switchAiTab(tabName) {
            document.querySelectorAll('.ai-tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.ai-tab-panel').forEach(p => p.style.display = 'none');
            const activeBtn = document.getElementById(`btn-tab-${tabName}`);
            const activePanel = document.getElementById(`panel-tab-${tabName}`);
            if (activeBtn) activeBtn.classList.add('active');
            if (activePanel) activePanel.style.display = 'block';
        }

        function renderSingleEngineContent(ai, engineTitle, badgeText, badgeColor) {
            if (!ai) return '<p style="color:var(--text-muted);">Không có dữ liệu phân tích từ mô hình này.</p>';
            const pc = { urgent: '#ef4444', high: '#f97316', medium: '#eab308', low: '#22c55e' };
            let h = '';
            
            if (engineTitle) {
                h += `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:8px;">
                    <h4 style="margin:0; font-size:1.1rem; color:var(--text-primary);">${engineTitle}</h4>
                    <span style="background:${badgeColor}20; color:${badgeColor}; border:1px solid ${badgeColor}40; padding:3px 10px; border-radius:6px; font-size:0.78rem; font-weight:700;">${badgeText}</span>
                </div>`;
            }

            if (ai.overall_assessment) {
                h += `<div class="alert alert-info" style="margin-bottom:16px; font-size:0.95rem; line-height:1.5;">${ai.overall_assessment}</div>`;
            }

            if (ai.strengths?.length) {
                h += `<h5 style="margin:14px 0 8px; color:#22c55e;">✅ Ưu điểm & Điểm đạt chuẩn</h5><ul style="padding-left:20px;color:var(--text-secondary);font-size:0.9rem;">${ai.strengths.map(s => `<li style="margin-bottom:4px;">${s}</li>`).join('')}</ul>`;
            }

            if (ai.critical_weaknesses?.length) {
                h += `<h5 style="margin:14px 0 8px; color:#ef4444;">⚠️ Tồn tại, vi phạm & nguy cơ cháy nổ</h5><ul style="padding-left:20px;color:var(--text-secondary);font-size:0.9rem;">${ai.critical_weaknesses.map(s => `<li style="margin-bottom:4px;">${s}</li>`).join('')}</ul>`;
            }

            if (ai.detailed_recommendations?.length) {
                h += `<h5 style="margin:18px 0 10px; color:#f97316;">🔧 Khuyến cáo chi tiết (${ai.detailed_recommendations.length} khuyến cáo)</h5>`;
                ai.detailed_recommendations.forEach((r, i) => {
                    const c = pc[r.priority] || '#94a3b8';
                    h += `<div style="background:rgba(255,255,255,0.03); border-radius:8px; padding:14px; margin-bottom:10px; border-left:3px solid ${c}; border:1px solid rgba(255,255,255,0.06); border-left-width:3px;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                            <strong style="color:var(--text-primary); font-size:0.92rem;">${i + 1}. ${r.title || ''}</strong>
                            <span style="background:${c}20; color:${c}; padding:2px 8px; border-radius:4px; font-size:0.75rem; font-weight:600;">${(r.priority || '').toUpperCase()}</span>
                        </div>
                        <p style="color:var(--text-secondary); font-size:0.85rem; margin:0 0 6px; line-height:1.5;">${r.description || ''}</p>
                        <div style="color:var(--text-muted); font-size:0.78rem; display:flex; flex-wrap:wrap; gap:8px;">
                            <span>⏰ ${r.deadline || '30 ngày'}</span>
                            ${r.category ? `<span>📂 ${r.category}</span>` : ''}
                            ${r.estimated_cost ? `<span>💰 ${r.estimated_cost}</span>` : ''}
                            ${r.responsible_party ? `<span>👤 ${r.responsible_party}</span>` : ''}
                        </div>
                        ${r.legal_basis ? `<div style="color:#8b5cf6; font-size:0.75rem; margin-top:6px;">📜 ${r.legal_basis}</div>` : ''}
                    </div>`;
                });
            } else if (ai.priority_actions?.length) {
                h += `<h5 style="margin:12px 0 8px; color:#f97316;">🎯 Hành động ưu tiên</h5><div class="action-list">${ai.priority_actions.map(a => `<div class="action-item ${a.priority}"><div class="action-title">${a.action}</div><div class="action-deadline">⏰ ${a.deadline || a.priority}</div></div>`).join('')}</div>`;
            }

            if (ai.daily_checklist?.length) {
                h += `<h5 style="margin:18px 0 8px; color:#06b6d4;">📋 Danh mục kiểm tra an toàn hàng ngày</h5>`;
                h += `<div style="background:rgba(6,182,212,0.06); border-radius:8px; padding:14px; border-left:3px solid #06b6d4;">`;
                h += `<ul style="padding-left:20px; margin:0; color:var(--text-secondary); font-size:0.85rem;">`;
                ai.daily_checklist.forEach(item => {
                    h += `<li style="margin-bottom:6px;">☑️ ${item}</li>`;
                });
                h += `</ul></div>`;
            }

            if (ai.improvement_plan) {
                const p = ai.improvement_plan;
                const phases = [
                    { key: '30_days', label: '🔴 GIAI ĐOẠN 1: 30 ngày đầu (Khẩn cấp)', color: '#ef4444', bg: 'rgba(239,68,68,0.08)', desc: 'Xử lý ngay các nguy cơ cháy nổ nghiêm trọng nhất, đảm bảo an toàn tối thiểu' },
                    { key: '60_days', label: '🟠 GIAI ĐOẠN 2: 30-60 ngày (Ưu tiên)', color: '#f97316', bg: 'rgba(249,115,22,0.08)', desc: 'Nâng cấp cơ sở hạ tầng PCCC, hoàn thiện quy trình và huấn luyện' },
                    { key: '90_days', label: '🟢 GIAI ĐOẠN 3: 60-90 ngày (Hoàn thiện)', color: '#22c55e', bg: 'rgba(34,197,94,0.08)', desc: 'Đánh giá lại, xây dựng kế hoạch duy trì dài hạn, hoàn thiện hồ sơ' },
                ];
                h += '<h5 style="margin:20px 0 12px; color:#3b82f6; font-size:1rem;">📅 Kế hoạch Cải thiện Chi tiết (90 ngày)</h5>';
                phases.forEach(phase => {
                    const items = p[phase.key];
                    if (!items?.length) return;
                    h += `<div style="background:${phase.bg}; border-radius: 8px; padding:16px; margin-bottom:14px; border-left:4px solid ${phase.color};">`;
                    h += `<div style="margin-bottom:10px;"><strong style="color:${phase.color}; font-size:0.92rem;">${phase.label}</strong>`;
                    h += `<p style="color:var(--text-muted); font-size:0.78rem; margin:4px 0 0;">${phase.desc}</p></div>`;
                    items.forEach((item, idx) => {
                        if (typeof item === 'string') {
                            h += `<div style="display:flex; gap:8px; margin-bottom:8px; padding:8px 10px; background:rgba(255,255,255,0.03); border-radius: 6px;">
                                <span style="color:${phase.color}; font-weight:700; min-width:20px;">${idx+1}.</span>
                                <span style="color:var(--text-secondary); font-size:0.84rem; line-height:1.5;">${item}</span>
                            </div>`;
                        } else {
                            h += `<div style="margin-bottom:10px; padding:10px 12px; background:rgba(255,255,255,0.03); border-radius: 6px;">
                                <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px;">
                                    <strong style="color:var(--text-primary); font-size:0.86rem;">${idx+1}. ${item.task || item.title || ''}</strong>
                                </div>
                                ${item.detail || item.description ? `<p style="color:var(--text-secondary); font-size:0.82rem; margin:4px 0 6px; line-height:1.5;">${item.detail || item.description}</p>` : ''}
                                <div style="display:flex; flex-wrap:wrap; gap:8px; font-size:0.75rem; color:var(--text-muted);">
                                    ${item.responsible ? `<span>👤 ${item.responsible}</span>` : ''}
                                    ${item.cost || item.estimated_cost ? `<span>💰 ${item.cost || item.estimated_cost}</span>` : ''}
                                    ${item.criteria || item.completion_criteria ? `<span>✅ ${item.criteria || item.completion_criteria}</span>` : ''}
                                    ${item.legal_basis ? `<span style="color:#8b5cf6;">📜 ${item.legal_basis}</span>` : ''}
                                </div>
                            </div>`;
                        }
                    });
                    h += '</div>';
                });
            }

            if (ai.legal_references?.length) {
                h += `<h5 style="margin:18px 0 8px; color:#8b5cf6;">📜 Tham chiếu văn bản quy phạm pháp luật</h5><ul style="padding-left:20px; color:var(--text-muted); font-size:0.82rem;">${ai.legal_references.map(r => `<li style="margin-bottom:3px;">${r}</li>`).join('')}</ul>`;
            }

            return h;
        }

        function buildAiSection(ai) {
            // Check if dual mode is active
            if (ai.dual_mode && (ai.gemini_38 || ai.rag_chroma)) {
                const g = ai.gemini_38;
                const r = ai.rag_chroma;

                return `
                <div class="dashboard-section mt-3">
                    <div class="section-title" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
                        <h3>🤖 Đánh giá & Khuyến cáo Song song (Dual AI)</h3>
                        <span style="background:rgba(59,130,246,0.15); color:#60a5fa; padding:4px 12px; border-radius:20px; font-size:0.82rem; font-weight:600;">
                            ⚡ Gemini 3.8 Flash vs 📚 RAG ChromaDB
                        </span>
                    </div>

                    <div class="alert alert-info" style="margin-bottom:18px; font-size:0.88rem; line-height:1.5;">
                        ⚖️ <strong>Hệ thống phân tích đồng thời bằng 2 mô hình AI để quý vị đối chiếu:</strong><br>
                        • <strong>1. Gemini 3.8 Flash (9Router VPS):</strong> Mô hình ưu tiên khuyến cáo thực tế, giải pháp kỹ thuật và lộ trình khắc phục cho cơ sở.<br>
                        • <strong>2. RAG & CSDL ChromaDB:</strong> Hệ thống đối soát trực tiếp từ CSDL văn bản pháp luật (NĐ 105, NĐ 106/2025, Luật 55/2024/QH15) chỉ rõ điều khoản vi phạm và chế tài xử phạt.
                    </div>

                    <div class="ai-tab-bar">
                        <button type="button" class="ai-tab-btn active" id="btn-tab-gemini" onclick="switchAiTab('gemini')">
                            ⚡ 1. Tư vấn từ Gemini 3.8 Flash (Ưu tiên)
                        </button>
                        <button type="button" class="ai-tab-btn" id="btn-tab-rag" onclick="switchAiTab('rag')">
                            📚 2. Thẩm định từ RAG & CSDL ChromaDB
                        </button>
                        <button type="button" class="ai-tab-btn" id="btn-tab-compare" onclick="switchAiTab('compare')">
                            ⚖️ 3. So sánh trực tiếp (2 Cột song song)
                        </button>
                    </div>

                    <!-- Panel 1: Gemini 3.8 Flash -->
                    <div class="ai-tab-panel" id="panel-tab-gemini">
                        ${renderSingleEngineContent(g, "Khuyến cáo Thực tế từ Gemini 3.8 Flash (9Router VPS)", "MÔ HÌNH ƯU TIÊN", "#2563eb")}
                    </div>

                    <!-- Panel 2: RAG ChromaDB -->
                    <div class="ai-tab-panel" id="panel-tab-rag" style="display:none;">
                        ${renderSingleEngineContent(r, "Thẩm định Pháp lý & Vi phạm từ RAG ChromaDB", "CSDL ĐỐI SOÁT", "#8b5cf6")}
                    </div>

                    <!-- Panel 3: Side-by-side comparison -->
                    <div class="ai-tab-panel" id="panel-tab-compare" style="display:none;">
                        <div class="ai-compare-grid">
                            <!-- Cột 1: Gemini 3.8 Flash -->
                            <div class="ai-compare-card">
                                <div class="ai-compare-header">
                                    <div>
                                        <strong style="color:#60a5fa; font-size:1.05rem;">⚡ Gemini 3.8 Flash</strong>
                                        <div style="font-size:0.75rem; color:var(--text-muted);">9Router Endpoint VPS</div>
                                    </div>
                                    <span style="background:rgba(37,99,235,0.2); color:#60a5fa; padding:2px 8px; border-radius:4px; font-size:0.72rem; font-weight:700;">THỰC TẾ CƠ SỞ</span>
                                </div>
                                <div style="font-size:0.86rem; line-height:1.5; color:var(--text-secondary); margin-bottom:14px;">
                                    <strong style="color:var(--text-primary); display:block; margin-bottom:4px;">📌 Đánh giá tổng quan:</strong>
                                    ${g?.overall_assessment || 'Đang cập nhật'}
                                </div>
                                <div style="margin-bottom:14px;">
                                    <strong style="color:#ef4444; font-size:0.85rem; display:block; margin-bottom:6px;">⚠️ Tồn tại & Nguy cơ:</strong>
                                    <ul style="padding-left:18px; margin:0; font-size:0.82rem; color:var(--text-secondary);">
                                        ${(g?.critical_weaknesses || []).map(w => `<li style="margin-bottom:4px;">${w}</li>`).join('')}
                                    </ul>
                                </div>
                                <div>
                                    <strong style="color:#f97316; font-size:0.85rem; display:block; margin-bottom:6px;">🔧 Khuyến cáo giải pháp:</strong>
                                    <ul style="padding-left:18px; margin:0; font-size:0.82rem; color:var(--text-secondary);">
                                        ${(g?.detailed_recommendations || []).slice(0, 4).map(r => `<li style="margin-bottom:6px;"><strong>${r.title}</strong>: ${r.description} (Chi phí: ${r.estimated_cost || 'N/A'})</li>`).join('')}
                                    </ul>
                                </div>
                            </div>

                            <!-- Cột 2: RAG ChromaDB -->
                            <div class="ai-compare-card">
                                <div class="ai-compare-header">
                                    <div>
                                        <strong style="color:#c084fc; font-size:1.05rem;">📚 RAG & ChromaDB</strong>
                                        <div style="font-size:0.75rem; color:var(--text-muted);">CSDL Văn bản & Quy chuẩn</div>
                                    </div>
                                    <span style="background:rgba(139,92,246,0.2); color:#c084fc; padding:2px 8px; border-radius:4px; font-size:0.72rem; font-weight:700;">ĐỐI SOÁT PHÁP LÝ</span>
                                </div>
                                <div style="font-size:0.86rem; line-height:1.5; color:var(--text-secondary); margin-bottom:14px;">
                                    <strong style="color:var(--text-primary); display:block; margin-bottom:4px;">📌 Thẩm định tuân thủ:</strong>
                                    ${r?.overall_assessment || 'Đang cập nhật'}
                                </div>
                                <div style="margin-bottom:14px;">
                                    <strong style="color:#ef4444; font-size:0.85rem; display:block; margin-bottom:6px;">⚖️ Điều khoản vi phạm & Chế tài:</strong>
                                    <ul style="padding-left:18px; margin:0; font-size:0.82rem; color:var(--text-secondary);">
                                        ${(r?.critical_weaknesses || []).map(w => `<li style="margin-bottom:4px;">${w}</li>`).join('')}
                                    </ul>
                                </div>
                                <div>
                                    <strong style="color:#a855f7; font-size:0.85rem; display:block; margin-bottom:6px;">📜 Viện dẫn quy chuẩn & Nghị định:</strong>
                                    <ul style="padding-left:18px; margin:0; font-size:0.82rem; color:var(--text-secondary);">
                                        ${(r?.legal_references || []).slice(0, 4).map(ref => `<li style="margin-bottom:4px;">${ref}</li>`).join('')}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }

            // Single engine fallback
            return `<div class="dashboard-section mt-3">
                <div class="section-title"><h3>👩‍💼 Khuyến cáo từ Trợ lý Chi</h3></div>
                ${renderSingleEngineContent(ai, null, "", "")}
            </div>`;
        }

        async function requestAI(id) {
            const btnAI = document.getElementById('btn-ai');
            const container = document.getElementById('ai-result-container');
            if (btnAI) { btnAI.disabled = true; btnAI.innerHTML = '⏳ Đang phân tích...'; }
            if (container) container.innerHTML = '<div style="text-align:center; padding:30px;"><div class="loading-spinner"></div><p style="color:var(--text-secondary); margin-top:12px;">🤖 AI đang phân tích dữ liệu khảo sát...</p></div>';
            try {
                const result = await api.post(`/ai/analyze/${id}`, {});
                const ai = result.analysis || result;
                if (btnAI) { btnAI.innerHTML = '✅ Đã phân tích'; }
                if (container) container.innerHTML = buildAiSection(ai);
            } catch (error) {
                if (btnAI) { btnAI.disabled = false; btnAI.innerHTML = '🤖 Phân tích AI'; }
                if (container) container.innerHTML = '';
                showToast('Lỗi phân tích AI: ' + error.message, 'error');
            }
        }
    </script>
</body>

</html>
