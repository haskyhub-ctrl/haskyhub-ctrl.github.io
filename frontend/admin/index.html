<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị - FRAS</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="nav-brand">
                <span class="logo-icon"><img src="/img/logo-cand.png" alt="CAND" width="36" height="36" style="object-fit:contain;filter:brightness(0) invert(1);"></span>
                <div><span>FRAS Admin</span><small>Quản trị Hệ thống</small></div>
            </a>
            <ul class="nav-links" id="nav-links">
                <li><a href="/">Trang chủ</a></li>
            </ul>
            <div class="nav-user" id="nav-user"></div>
            <button class="nav-mobile-toggle">&#9776;</button>
        </div>

    <div class="admin-layout">

            <div class="sidebar-header">
                <h3>Quản trị hệ thống</h3>
                <p>Bảng điều khiển admin</p>

                    </a>

                        </span>
                        Người dùng
                    </a>
                </li>
                <li>
                    <a href="/admin/questions.html">
                        <span class="nav-icon">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>

                <li>
                    <a href="/admin/assessments.html">
                        <span class="nav-icon">
                            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                        </span>
                        Đánh giá
                    </a>
                </li>
                <li>
                    <a href="/admin/reports.html">
                        <span class="nav-icon">
                            <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                        </span>
                        Báo cáo
                    </a>
                </li>
                <li>
                    <a href="/admin/aggregate.html">
                        <span class="nav-icon">
                            <svg viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
                        </span>

                    </a>
                </li>
            </ul>

            <div class="dashboard-row">

                        <h3>Phân bố Mức Nguy cơ</h3>
                    </div>
                    <div class="chart-container" style="height:250px;"><canvas id="risk-dist-chart"></canvas></div>
                </div>
                <div class="dashboard-section">
                    <div class="section-title">
                        <h3>Hoạt động Gần đây</h3>
                    </div>
                    <div class="activity-log" id="audit-log-list"></div>

    <script src="/js/api.js"></script>
    <script src="/js/admin.js"></script>
    <script>onReady(() => { setupNavbar(); initAdminDashboard(); });</script>
