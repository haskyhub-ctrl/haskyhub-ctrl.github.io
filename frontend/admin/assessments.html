<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đánh giá - FRAS Admin</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        .filter-bar { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
        .filter-bar select { background:var(--glass-bg); color:var(--text-primary); border:1px solid var(--border-color); border-radius:0; padding:8px 14px; font-size:.9rem; min-width:160px; }
        .view-toggle { display:flex; gap:4px; margin-left:auto; }
        .view-toggle button { padding:8px 14px; background:transparent; border:1px solid var(--border-color); color:var(--text-secondary); border-radius:0; cursor:pointer; font-size:.85rem; transition:all .2s; }
        .view-toggle button.active { background:var(--accent-orange); border-color:var(--accent-orange); color:#fff; }
        .facility-group { margin-bottom:24px; }
        .facility-group-header { display:flex; align-items:center; gap:8px; padding:10px 16px; background:var(--glass-bg); border:1px solid var(--border-color); font-weight:600; font-size:.95rem; }
        .facility-group-header .count { background:rgba(255,255,255,.1); padding:2px 10px; border-radius:0; font-size:.8rem; color:var(--text-muted); }

        /* Bulk action bar */
        .bulk-bar { display:none; align-items:center; gap:12px; background:rgba(255,140,0,.1); border:1px solid rgba(255,140,0,.4); padding:10px 16px; margin-bottom:12px; }
        .bulk-bar.visible { display:flex; }
        .bulk-bar span { font-weight:600; font-size:.9rem; }
        .btn-danger { background:#c0392b; color:#fff; border:none; padding:7px 16px; cursor:pointer; border-radius:0; font-size:.85rem; font-weight:600; display:inline-flex; align-items:center; gap:6px; transition:background .2s; }
        .btn-danger:hover { background:#a93226; }
        .btn-generate { background:linear-gradient(135deg,#6c3fc5,#9b59b6); color:#fff; border:none; padding:9px 18px; cursor:pointer; border-radius:0; font-size:.88rem; font-weight:600; display:inline-flex; align-items:center; gap:6px; transition:opacity .2s; }
        .btn-generate:hover { opacity:.88; }
        .badge-demo { background:rgba(150,90,220,.25); color:#b07de0; font-size:.7rem; padding:1px 7px; border:1px solid rgba(150,90,220,.4); border-radius:2px; vertical-align:middle; margin-left:4px; }

        /* Checkbox col */
        th.chk-col, td.chk-col { width:36px; text-align:center; padding:0 6px; }
        input[type=checkbox] { width:16px; height:16px; cursor:pointer; }

        /* Generate modal */
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:9999; align-items:center; justify-content:center; }
        .modal-overlay.open { display:flex; }
        .modal-box { background:#1e2235; border:1px solid var(--border-color); border-radius:8px; width:min(520px,95vw); padding:28px 32px; max-height:90vh; overflow-y:auto; }
        .modal-box h3 { margin:0 0 20px; font-size:1.1rem; display:flex; align-items:center; gap:8px; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-size:.85rem; color:var(--text-secondary); margin-bottom:6px; font-weight:500; }
        .form-group select, .form-group input[type=number] { width:100%; background:var(--glass-bg); color:var(--text-primary); border:1px solid var(--border-color); border-radius:0; padding:9px 12px; font-size:.9rem; }
        .form-group input[type=range] { width:100%; }
        .radio-group { display:flex; flex-direction:column; gap:8px; }
        .radio-group label { display:flex; align-items:center; gap:10px; font-size:.88rem; color:var(--text-primary); cursor:pointer; }
        .modal-footer { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; }
        .btn-cancel { background:transparent; color:var(--text-secondary); border:1px solid var(--border-color); padding:9px 20px; cursor:pointer; border-radius:0; font-size:.88rem; }
        .btn-cancel:hover { background:rgba(255,255,255,.05); }
        .count-display { font-size:1.4rem; font-weight:700; color:var(--accent-orange); text-align:center; margin:4px 0; }

        /* Confirm modal */
        .confirm-modal { background:#1e2235; border:1px solid #c0392b; border-radius:8px; width:min(420px,95vw); padding:24px; }
        .confirm-modal h3 { color:#e74c3c; margin:0 0 12px; }
        .confirm-modal p { color:var(--text-secondary); font-size:.9rem; margin-bottom:20px; }
        .confirm-modal .modal-footer { margin-top:0; }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="nav-brand"><span class="logo-icon"><img src="/img/logo-cand.png" alt="CAND" width="36" height="36" style="object-fit:contain;filter:brightness(0) invert(1);"></span>
                <div><span>FRAS Admin</span><small>Quản trị Hệ thống</small></div>
            </a>
            <ul class="nav-links" id="nav-links"><li><a href="/">Trang chủ</a></li></ul>
            <div class="nav-user" id="nav-user"></div>
        </div>
    </nav>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="sidebar-header"><h3>Quản trị</h3><p>Bảng điều khiển admin</p></div>
            <ul class="sidebar-nav">
                <li><a href="/admin/"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span> Tổng quan</a></li>
                <li><a href="/admin/users.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> Người dùng</a></li>
                <li><a href="/admin/questions.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span> Câu hỏi</a></li>
                <li><a href="/admin/assessments.html" class="active"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span> Đánh giá</a></li>
                <li><a href="/admin/reports.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span> Báo cáo</a></li>
                <li><a href="/admin/aggregate.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg></span> Phân tích tổng hợp</a></li>
                <li><a href="/map.html"><span class="nav-icon">📍</span> Bản đồ</a></li>
            </ul>
        </aside>
        <main class="admin-content">
            <div class="page-header" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                <h2 style="margin:0;">📋 Quản lý Đánh giá</h2>
                <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;">
                    <button class="btn-generate" onclick="openGenerateModal()">✨ Tạo dữ liệu mẫu</button>
                    <button class="btn-danger" onclick="confirmDeleteAllDemo()">🗑️ Xóa tất cả Demo</button>
                </div>
            </div>

            <!-- Bulk action bar -->
            <div class="bulk-bar" id="bulk-bar">
                <span id="selected-count">Đã chọn 0 bài</span>
                <button class="btn-danger" onclick="confirmBulkDelete()">🗑️ Xóa đã chọn</button>
                <button class="btn-cancel" onclick="clearSelection()" style="margin-left:auto;">Bỏ chọn</button>
            </div>

            <div class="filter-bar">
                <select id="filter-risk" onchange="applyFilters()">
                    <option value="">Tất cả mức nguy cơ</option>
                    <option value="safe">🟢 An toàn</option>
                    <option value="low">🟡 Nguy cơ Thấp</option>
                    <option value="medium">🟠 Nguy cơ Trung bình</option>
                    <option value="high">🔴 Nguy cơ Cao</option>
                    <option value="critical">⛔ Nguy cơ Rất cao</option>
                </select>
                <select id="filter-facility" onchange="applyFilters()">
                    <option value="">Tất cả loại hình</option>
                    <option value="industrial">🏭 Sản xuất công nghiệp</option>
                    <option value="warehouse">🏪 Kho hàng</option>
                    <option value="mixed_residence">🏠 Nhà ở hỗn hợp</option>
                    <option value="hospitality">🍽️ Nhà hàng, khách sạn</option>
                    <option value="medical_education">🏥 Bệnh viện, trường học</option>
                    <option value="fuel_gas">⛽ Xăng dầu, khí gas</option>
                    <option value="transport">🚌 Giao thông</option>
                    <option value="residential">🏘️ Khu dân cư</option>
                    <option value="construction">🏗️ Xây dựng</option>
                    <option value="office">🏛️ Văn phòng</option>
                    <option value="laboratory">🔬 Phòng thí nghiệm</option>
                    <option value="agriculture">🌾 Nông nghiệp</option>
                </select>
                <select id="filter-demo" onchange="applyFilters()">
                    <option value="1">Tất cả (kể cả Demo)</option>
                    <option value="0">Chỉ dữ liệu thực</option>
                </select>
                <div class="view-toggle">
                    <button class="active" id="view-list" onclick="setView('list')">📋 Danh sách</button>
                    <button id="view-group" onclick="setView('group')">📁 Nhóm theo loại</button>
                </div>
            </div>

            <div id="assessments-container">
                <div class="table-wrapper">
                    <table><thead><tr><td colspan="9" style="text-align:center;padding:40px;"><div class="loading-spinner"></div></td></tr></thead></table>
                </div>
            </div>
        </main>
    </div>

    <!-- ===== GENERATE MODAL ===== -->
    <div class="modal-overlay" id="modal-generate">
        <div class="modal-box">
            <h3>✨ Tạo dữ liệu mẫu đánh giá</h3>
            <div class="form-group">
                <label>Tỉnh / Thành phố</label>
                <select id="gen-province">
                    <option>Bắc Ninh</option><option>Hà Nội</option><option>Hải Phòng</option>
                    <option>Hồ Chí Minh</option><option>Đà Nẵng</option><option>Cần Thơ</option>
                    <option>Quảng Ninh</option><option>Vĩnh Phúc</option><option>Hưng Yên</option>
                    <option>Hải Dương</option><option>Thái Bình</option><option>Nam Định</option>
                    <option>Ninh Bình</option><option>Thanh Hóa</option><option>Nghệ An</option>
                    <option>Hà Tĩnh</option><option>Quảng Bình</option><option>Quảng Trị</option>
                    <option>Thừa Thiên Huế</option><option>Quảng Nam</option><option>Quảng Ngãi</option>
                    <option>Bình Định</option><option>Phú Yên</option><option>Khánh Hòa</option>
                    <option>Ninh Thuận</option><option>Bình Thuận</option><option>Kon Tum</option>
                    <option>Gia Lai</option><option>Đắk Lắk</option><option>Đắk Nông</option>
                    <option>Lâm Đồng</option><option>Bình Phước</option><option>Tây Ninh</option>
                    <option>Bình Dương</option>
                </select>
            </div>
            <div class="form-group">
                <label>Loại hình cơ sở</label>
                <select id="gen-facility">
                    <option value="">Ngẫu nhiên (tất cả loại)</option>
                    <option value="industrial">🏭 Sản xuất công nghiệp</option>
                    <option value="warehouse">🏪 Kho hàng</option>
                    <option value="mixed_residence">🏠 Nhà ở hỗn hợp</option>
                    <option value="hospitality">🍽️ Nhà hàng, khách sạn</option>
                    <option value="medical_education">🏥 Bệnh viện, trường học</option>
                    <option value="fuel_gas">⛽ Xăng dầu, khí gas</option>
                    <option value="transport">🚌 Giao thông</option>
                    <option value="residential">🏘️ Khu dân cư</option>
                    <option value="office">🏛️ Văn phòng</option>
                    <option value="agriculture">🌾 Nông nghiệp</option>
                </select>
            </div>
            <div class="form-group">
                <label>Số lượng bài đánh giá: <span class="count-display" id="gen-count-display">20</span></label>
                <input type="range" id="gen-count" min="1" max="100" value="20" oninput="document.getElementById('gen-count-display').textContent=this.value">
            </div>
            <div class="form-group">
                <label>Phân bổ mức nguy cơ</label>
                <div class="radio-group">
                    <label><input type="radio" name="gen-dist" value="random" checked> 🎲 Ngẫu nhiên (mặc định)</label>
                    <label><input type="radio" name="gen-dist" value="high_focus"> 🔴 Tập trung nguy cơ cao (60% cao/rất cao)</label>
                    <label><input type="radio" name="gen-dist" value="balanced"> ⚖️ Phân bổ đều (20% mỗi mức)</label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeGenerateModal()">Hủy</button>
                <button class="btn-generate" id="btn-gen-submit" onclick="submitGenerate()">✨ Tạo dữ liệu</button>
            </div>
        </div>
    </div>

    <!-- ===== CONFIRM DELETE MODAL ===== -->
    <div class="modal-overlay" id="modal-confirm">
        <div class="confirm-modal">
            <h3 id="confirm-title">⚠️ Xác nhận xóa</h3>
            <p id="confirm-msg">Bạn có chắc chắn muốn xóa?</p>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeConfirmModal()">Hủy</button>
                <button class="btn-danger" id="btn-confirm-ok" onclick="executeConfirm()">🗑️ Xóa</button>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/admin.js"></script>
    <script>
        let currentView = 'list';
        let allAssessments = [];
        let selectedIds = new Set();
        let confirmCallback = null;

        const riskLabels = { safe:'An toàn', low:'Thấp', medium:'Trung bình', high:'Cao', critical:'Rất cao' };
        const facilityLabels = {
            industrial:'🏭 Sản xuất CN', warehouse:'🏪 Kho hàng', mixed_residence:'🏠 Nhà ở HH',
            hospitality:'🍽️ Nhà hàng/KS', medical_education:'🏥 Y tế/Giáo dục',
            fuel_gas:'⛽ Xăng dầu/Gas', transport:'🚌 Giao thông', residential:'🏘️ Khu dân cư',
            construction:'🏗️ Xây dựng', office:'🏛️ Văn phòng', laboratory:'🔬 Phòng thí nghiệm', agriculture:'🌾 Nông nghiệp',
        };

        // ===== SELECTION =====
        function toggleSelect(id, el) {
            if (el.checked) selectedIds.add(id); else selectedIds.delete(id);
            updateBulkBar();
        }
        function toggleSelectAll(el) {
            const checkboxes = document.querySelectorAll('.row-chk');
            checkboxes.forEach(c => {
                c.checked = el.checked;
                if (el.checked) selectedIds.add(c.dataset.id); else selectedIds.delete(c.dataset.id);
            });
            updateBulkBar();
        }
        function updateBulkBar() {
            const bar = document.getElementById('bulk-bar');
            const cnt = document.getElementById('selected-count');
            if (selectedIds.size > 0) {
                bar.classList.add('visible');
                cnt.textContent = `Đã chọn ${selectedIds.size} bài đánh giá`;
            } else {
                bar.classList.remove('visible');
            }
        }
        function clearSelection() {
            selectedIds.clear();
            document.querySelectorAll('.row-chk, #chk-all').forEach(c => c.checked = false);
            updateBulkBar();
        }

        // ===== GENERATE MODAL =====
        function openGenerateModal() { document.getElementById('modal-generate').classList.add('open'); }
        function closeGenerateModal() { document.getElementById('modal-generate').classList.remove('open'); }

        async function submitGenerate() {
            const btn = document.getElementById('btn-gen-submit');
            btn.disabled = true; btn.textContent = '⏳ Đang tạo...';
            try {
                const res = await api.post('/admin/assessments/generate', {
                    count: parseInt(document.getElementById('gen-count').value),
                    province: document.getElementById('gen-province').value,
                    facility_type: document.getElementById('gen-facility').value || null,
                    risk_distribution: document.querySelector('input[name="gen-dist"]:checked').value,
                });
                closeGenerateModal();
                showToast(`✅ ${res.message}`, 'success');
                await loadAllAssessments();
            } catch(e) {
                showToast(e.message, 'error');
            } finally {
                btn.disabled = false; btn.textContent = '✨ Tạo dữ liệu';
            }
        }

        // ===== CONFIRM MODAL =====
        function openConfirmModal(title, msg, cb) {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-msg').textContent = msg;
            confirmCallback = cb;
            document.getElementById('modal-confirm').classList.add('open');
        }
        function closeConfirmModal() { document.getElementById('modal-confirm').classList.remove('open'); confirmCallback = null; }
        function executeConfirm() { closeConfirmModal(); if (confirmCallback) confirmCallback(); }

        // ===== DELETE ACTIONS =====
        function confirmDeleteOne(id, name) {
            openConfirmModal('⚠️ Xác nhận xóa đánh giá', `Xóa bài đánh giá "${name}"? Hành động này không thể hoàn tác.`, () => deleteOne(id));
        }
        async function deleteOne(id) {
            try {
                const res = await api.delete(`/admin/assessments/${id}`);
                showToast(`✅ ${res.message}`, 'success');
                selectedIds.delete(id);
                updateBulkBar();
                await loadAllAssessments();
            } catch(e) { showToast(e.message, 'error'); }
        }

        function confirmBulkDelete() {
            if (!selectedIds.size) return;
            openConfirmModal('⚠️ Xác nhận xóa hàng loạt', `Xóa ${selectedIds.size} bài đánh giá đã chọn? Hành động này không thể hoàn tác.`, bulkDelete);
        }
        async function bulkDelete() {
            try {
                const res = await api.delete('/admin/assessments/bulk', { ids: [...selectedIds] });
                showToast(`✅ ${res.message}`, 'success');
                selectedIds.clear();
                updateBulkBar();
                await loadAllAssessments();
            } catch(e) { showToast(e.message, 'error'); }
        }

        function confirmDeleteAllDemo() {
            openConfirmModal('🗑️ Xóa tất cả dữ liệu Demo', 'Xóa toàn bộ bài đánh giá được đánh dấu Demo? Dữ liệu thực sẽ không bị ảnh hưởng.', deleteAllDemo);
        }
        async function deleteAllDemo() {
            try {
                const res = await api.delete('/admin/assessments/demo');
                showToast(`✅ ${res.message}`, 'success');
                selectedIds.clear();
                updateBulkBar();
                await loadAllAssessments();
            } catch(e) { showToast(e.message, 'error'); }
        }

        // ===== LOAD & RENDER =====
        function setView(view) {
            currentView = view;
            document.getElementById('view-list').classList.toggle('active', view === 'list');
            document.getElementById('view-group').classList.toggle('active', view === 'group');
            renderAssessments();
        }

        async function applyFilters() {
            const risk = document.getElementById('filter-risk').value;
            const facility = document.getElementById('filter-facility').value;
            const demo = document.getElementById('filter-demo').value;
            await loadAllAssessments(risk, facility, demo);
        }

        async function loadAllAssessments(riskLevel='', facilityType='', includeDemo='1') {
            try {
                let params = new URLSearchParams();
                if (riskLevel) params.set('risk_level', riskLevel);
                if (facilityType) params.set('facility_type', facilityType);
                params.set('include_demo', includeDemo === '1' ? 'true' : 'false');
                allAssessments = await api.get('/admin/assessments?' + params.toString());
                selectedIds.clear();
                updateBulkBar();
                renderAssessments();
            } catch(e) {
                showToast(e.message, 'error');
            }
        }

        function renderAssessments() {
            if (currentView === 'group') renderGrouped(); else renderList();
        }

        function rowHtml(a) {
            const demoTag = a.is_demo ? '<span class="badge-demo">📊 Demo</span>' : '';
            return `<tr>
                <td class="chk-col"><input type="checkbox" class="row-chk" data-id="${a.id}" onchange="toggleSelect('${a.id}',this)"></td>
                <td><strong>${a.facility_name}</strong>${demoTag}<br><small style="color:var(--text-muted)">${a.facility_address || ''}</small></td>
                <td>${facilityLabels[a.facility_type] || a.facility_type || 'N/A'}</td>
                <td>${a.user_name || 'N/A'}</td>
                <td>${a.organization || 'N/A'}</td>
                <td>${a.total_score}/${a.max_possible_score} (${a.risk_percentage}%)</td>
                <td><span class="status-badge ${a.risk_level}">${riskLabels[a.risk_level] || a.risk_level}</span></td>
                <td>${a.completed_at ? new Date(a.completed_at).toLocaleDateString('vi-VN') : 'N/A'}</td>
                <td style="white-space:nowrap; display:flex; gap:4px;">
                    <a href="/result.html?id=${a.id}" class="btn btn-sm btn-secondary">👁️ Xem</a>
                    <button class="btn-danger" style="padding:4px 10px;font-size:.78rem;" onclick="confirmDeleteOne('${a.id}','${a.facility_name.replace(/'/g,"\\'")}')">🗑️</button>
                </td>
            </tr>`;
        }

        function renderList() {
            const container = document.getElementById('assessments-container');
            const rows = allAssessments.map(rowHtml).join('');
            container.innerHTML = `<div class="table-wrapper"><table>
                <thead><tr>
                    <th class="chk-col"><input type="checkbox" id="chk-all" onchange="toggleSelectAll(this)" title="Chọn tất cả"></th>
                    <th>Cơ sở</th><th>Loại hình</th><th>Người đánh giá</th><th>Tổ chức</th>
                    <th>Điểm</th><th>Mức nguy cơ</th><th>Ngày</th><th>Thao tác</th>
                </tr></thead>
                <tbody>${rows || '<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-muted)">Chưa có đánh giá nào</td></tr>'}</tbody>
            </table></div>`;
        }

        function renderGrouped() {
            const container = document.getElementById('assessments-container');
            const groups = {};
            allAssessments.forEach(a => {
                const key = a.facility_type || 'unknown';
                if (!groups[key]) groups[key] = [];
                groups[key].push(a);
            });
            if (!Object.keys(groups).length) {
                container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted)">Chưa có đánh giá nào</div>';
                return;
            }
            let html = '';
            for (const [type, items] of Object.entries(groups)) {
                const rows = items.map(a => `<tr>
                    <td class="chk-col"><input type="checkbox" class="row-chk" data-id="${a.id}" onchange="toggleSelect('${a.id}',this)" ${selectedIds.has(a.id)?'checked':''}></td>
                    <td><strong>${a.facility_name}</strong>${a.is_demo?'<span class="badge-demo">📊 Demo</span>':''}</td>
                    <td>${a.user_name || 'N/A'}</td>
                    <td>${a.total_score}/${a.max_possible_score} (${a.risk_percentage}%)</td>
                    <td><span class="status-badge ${a.risk_level}">${riskLabels[a.risk_level]||a.risk_level}</span></td>
                    <td>${a.completed_at ? new Date(a.completed_at).toLocaleDateString('vi-VN') : 'N/A'}</td>
                    <td style="white-space:nowrap;display:flex;gap:4px;">
                        <a href="/result.html?id=${a.id}" class="btn btn-sm btn-secondary">👁️</a>
                        <button class="btn-danger" style="padding:4px 10px;font-size:.78rem;" onclick="confirmDeleteOne('${a.id}','${a.facility_name.replace(/'/g,"\\'")}')">🗑️</button>
                    </td>
                </tr>`).join('');
                html += `<div class="facility-group">
                    <div class="facility-group-header">${facilityLabels[type]||type} <span class="count">${items.length} cơ sở</span></div>
                    <div class="table-wrapper"><table>
                        <thead><tr><th class="chk-col">☑</th><th>Cơ sở</th><th>Người đánh giá</th><th>Điểm</th><th>Mức nguy cơ</th><th>Ngày</th><th>Thao tác</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table></div>
                </div>`;
            }
            container.innerHTML = html;
        }

        onReady(() => {
            setupNavbar();
            if (requireAuth()) loadAllAssessments();
        });
    </script>
</body>
</html>
