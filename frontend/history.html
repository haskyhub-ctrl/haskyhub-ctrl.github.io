<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử Đánh giá - FRAS</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="nav-brand"><span class="logo-icon"><img src="/img/logo-cand.png" alt="CAND" width="36" height="36" style="object-fit:contain;filter:brightness(0) invert(1);"></span>
                <div><span>FRAS</span><small>Đánh giá Nguy cơ Cháy Nổ</small></div>
            </a>
            <ul class="nav-links" id="nav-links"></ul>
            <div class="nav-user" id="nav-user"></div>
            <button class="nav-mobile-toggle">&#9776;</button>
        </div>
    </nav>

    <div class="page-content">
        <div class="container">
            <div class="page-header"
                style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
                <div>
                    <h1 class="fade-in">📋 Lịch sử Đánh giá</h1>
                    <p style="color:var(--text-secondary);">Tất cả các đánh giá bạn đã thực hiện</p>
                </div>
                <div style="display:flex; gap:10px;">
                    <a href="/compare.html" class="btn btn-secondary btn-sm">📊 So sánh</a>
                    <a href="/survey.html" class="btn btn-primary btn-sm">+ Đánh giá mới</a>
                </div>
            </div>

            <div class="table-wrapper" id="history-table">
                <div style="text-align:center; padding:60px;">
                    <div class="loading-spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        let _isAdmin = false;

        onReady(async () => {
            setupNavbar();
            if (!requireAuth()) return;

            const user = api.getUser();
            _isAdmin = user && (user.role === 'admin' || user.role === 'superadmin');

            // Update page title for admin
            if (_isAdmin) {
                const h2 = document.querySelector('h2');
                if (h2) h2.textContent = 'Lịch sử Đánh giá Toàn Hệ thống';
            }

            await loadHistory();
        });

        async function loadHistory() {
            try {
                const endpoint = _isAdmin ? '/admin/assessments' : '/assessments';
                const assessments = await api.get(endpoint);
                renderHistory(assessments);
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        function renderHistory(assessments) {
            const container = document.getElementById('history-table');
            if (!assessments.length) {
                container.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div><h3>Chưa có đánh giá nào</h3><p>Bắt đầu đánh giá đầu tiên của bạn</p><a href="/survey.html" class="btn btn-primary">Bắt đầu Đánh giá</a></div>`;
                return;
            }

            const adminCols = _isAdmin
                ? `<th>Người đánh giá</th><th>Tổ chức</th>`
                : '';
            const adminCells = (a) => _isAdmin
                ? `<td>${a.user_name || '—'}</td><td>${a.organization || '—'}</td>`
                : '';
            const deleteBtn = (a) => _isAdmin ? '' :
                `<button class="btn-icon" onclick="deleteAssessment('${a.id}')" title="Xóa">🗑️</button>`;

            container.innerHTML = `
        <table>
            <thead>
                <tr>
                    <th>Cơ sở</th>
                    <th>Loại hình</th>
                    ${adminCols}
                    <th>Điểm</th>
                    <th>Mức nguy cơ</th>
                    <th>Trạng thái</th>
                    <th>Ngày</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                ${assessments.map(a => `
                <tr>
                    <td><strong>${a.facility_name}</strong></td>
                    <td>${a.facility_type || '—'}</td>
                    ${adminCells(a)}
                    <td><strong>${a.risk_percentage}%</strong> <span style="color:var(--text-muted); font-size:0.8rem;">(${a.total_score}/${a.max_possible_score})</span></td>
                    <td>${getRiskBadge(a.risk_level)}</td>
                    <td><span class="badge ${a.status === 'completed' ? 'badge-safe' : 'badge-info'}">${a.status === 'completed' ? 'Hoàn thành' : a.status === 'in_progress' ? 'Đang làm' : 'Lưu trữ'}</span></td>
                    <td>${formatDate(a.completed_at || a.created_at)}</td>
                    <td>
                        ${a.status === 'completed' ? `<a href="/result.html?id=${a.id}" class="btn btn-sm btn-secondary">Xem</a>` : ''}
                        ${deleteBtn(a)}
                    </td>
                </tr>
                `).join('')}
            </tbody>
        </table>`;
        }

        async function deleteAssessment(id) {
            if (!confirm('Bạn có chắc muốn xóa đánh giá này?')) return;
            try {
                await api.delete(`/assessments/${id}`);
                showToast('Đã xóa đánh giá');
                await loadHistory();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }
    </script>
</body>

</html>
