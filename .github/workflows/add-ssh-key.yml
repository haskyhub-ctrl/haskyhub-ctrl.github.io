name: Thêm khóa SSH của máy tính vào server

# Chạy tay: tab Actions -> chọn workflow này -> Run workflow.
# Dùng khi máy tính mới bị báo "Permission denied (publickey)": workflow dùng khóa đã lưu trong GitHub Secrets
# (ORACLE_SSH_KEY) để thêm khóa CÔNG KHAI của máy tính vào server. Khóa công khai (file .pub) không phải bí mật.

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: "Nội dung file .pub của máy tính (mặc định là khóa oracle_key.pub của máy ADMIN11)"
        required: true
        default: "ssh-rsa  admin11@THANHLONGDES"

jobs:
  add-key:
    name: Thêm khóa vào authorized_keys
    runs-on: ubuntu-latest
    steps:
      - name: Thêm khóa qua SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PUBKEY: ${{ inputs.public_key }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: PUBKEY
          script_stop: true
          script: |
            set -e
            case "$PUBKEY" in
              ssh-rsa\ *|ssh-ed25519\ *|ecdsa-sha2-*) ;;
              *) echo "Nội dung không phải khóa công khai SSH"; exit 1 ;;
            esac
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            touch ~/.ssh/authorized_keys
            if grep -qxF "$PUBKEY" ~/.ssh/authorized_keys; then
              echo "Khóa đã có sẵn trên server"
            else
              printf '%s\n' "$PUBKEY" >> ~/.ssh/authorized_keys
              echo "Đã thêm khóa mới"
            fi
            chmod 600 ~/.ssh/authorized_keys
