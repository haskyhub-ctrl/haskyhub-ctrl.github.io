name: Cập nhật khóa trên server (.env)

# Chạy tay: tab Actions -> chọn workflow này -> Run workflow.
# Lấy các khóa từ GitHub Secrets (Settings -> Secrets and variables -> Actions) rồi ghi vào
# /home/ubuntu/fras/backend/.env trên server và khởi động lại dịch vụ. Khóa không hiện trong nhật ký.
# Secret nào để trống thì giữ nguyên giá trị đang có trên server.

on:
  workflow_dispatch:
    inputs:
      rotate_secret_key:
        description: "Tạo SECRET_KEY mới (mọi người đang đăng nhập sẽ bị đăng xuất một lần)"
        type: boolean
        default: true

jobs:
  set-env:
    name: Ghi khóa vào .env trên server
    runs-on: ubuntu-latest
    steps:
      - name: Ghi .env qua SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          NINEROUTER_API_KEY: ${{ secrets.NINEROUTER_API_KEY }}
          NINEROUTER_BASE_URL: ${{ secrets.NINEROUTER_BASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ROTATE: ${{ inputs.rotate_secret_key }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: NINEROUTER_API_KEY,NINEROUTER_BASE_URL,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,GEMINI_API_KEY,ROTATE
          script: |
            exec 2>&1
            echo ">>> Bắt đầu, người dùng: $(whoami)"
            cd /home/ubuntu/fras/backend || { echo "LỖI: không vào được thư mục backend"; exit 1; }
            echo ">>> Thư mục: $(pwd)"
            ls -ld .env 2>&1 || echo "(chưa có .env, sẽ tạo mới)"
            [ -e .env ] || { touch .env || { echo "LỖI: không tạo được .env"; exit 1; }; }
            cp .env ".env.bak.$(date +%Y%m%d%H%M%S)" || { echo "LỖI: không sao lưu được .env (quyền ghi?)"; exit 1; }
            chmod 600 .env .env.bak.* 2>/dev/null || true

            # set_var TÊN GIÁ_TRỊ: thay hoặc thêm dòng TÊN=GIÁ_TRỊ; bỏ qua nếu giá trị rỗng
            set_var() {
              if [ -z "$2" ]; then echo "Bỏ qua (chưa có giá trị): $1"; return 0; fi
              grep -v "^$1=" .env > .env.tmp
              printf '%s=%s
' "$1" "$2" >> .env.tmp
              mv .env.tmp .env || { echo "LỖI: không ghi được .env"; return 1; }
              chmod 600 .env 2>/dev/null || true
              echo "Đã ghi: $1"
            }

            set_var NINEROUTER_API_KEY "$NINEROUTER_API_KEY" || exit 1
            set_var ROUTER_API_KEY "$NINEROUTER_API_KEY" || exit 1
            set_var NINEROUTER_BASE_URL "$NINEROUTER_BASE_URL" || exit 1
            set_var ROUTER_BASE_URL "$NINEROUTER_BASE_URL" || exit 1
            set_var TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN" || exit 1
            set_var TELEGRAM_CHAT_ID "$TELEGRAM_CHAT_ID" || exit 1
            set_var GEMINI_API_KEY "$GEMINI_API_KEY" || exit 1

            # SECRET_KEY (ký phiên đăng nhập): tạo mới nếu được yêu cầu hoặc nếu chưa có
            if [ "$ROTATE" = "true" ] || ! grep -q '^SECRET_KEY=.' .env; then
              set_var SECRET_KEY "$(openssl rand -hex 32)" || exit 1
            fi

            echo ">>> Khởi động lại dịch vụ..."
            sudo systemctl restart fras.service || { echo "LỖI: không khởi động lại được dịch vụ"; exit 1; }
            sleep 4
            if sudo systemctl is-active --quiet fras.service; then
              echo "Dịch vụ đang chạy"
            else
              echo "LỖI: dịch vụ không chạy sau khi khởi động lại"
              sudo systemctl status fras.service --no-pager | tail -15
              exit 1
            fi
